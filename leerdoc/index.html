ning op het bureau wordt of is ondergebracht. De ontvluchtingsgrond geldt dan niet: die persoon is niet van zijn vrijheid beroofd.<\/p>\n<p><strong>Art. 23 – melden.<\/strong> Gebruik van een vrijheidsbeperkend middel: <strong>onverwijld schriftelijk<\/strong> aan de hOvJ, met de redenen.<\/p>\n<h2>Veelgemaakte fouten<\/h2>\n<ol>\n<li>Melden, registreren en kennisgeven door elkaar halen.<\/li>\n<li>Denken dat alleen geweld met letsel gemeld hoeft te worden.<\/li>\n<li>De vierjaarseis bij de hond vergeten, of de drie extra eisen van het vuurwapen erbij halen.<\/li>\n<li>Vergeten dat de hond bij verspreiden aangelijnd moet zijn.<\/li>\n<li>Boeien aanleggen omdat het altijd zo gaat.<\/li>\n<\/ol>", "quiz": [{"v": "Na een inbraakalarm bij een bedrijf laat de hondengeleider zijn surveillancehond het terrein afzoeken. De hond vindt niemand en bijt niemand. Is de Ambtsinstructie op deze inzet van toepassing?", "art": "Art. 15 Ambtsinstructie (toelichting)", "o": [{"t": "Nee: de Ambtsinstructie regelt alleen de inzet van de hond als geweldmiddel", "u": "Alleen laten zoeken (revieren) valt er niet onder. Voor het betreden of doorzoeken kunnen wel andere bevoegdheden nodig zijn.", "c": true}, {"t": "Ja: elke inzet van een politiehond valt onder art. 15 tot en met 15b", "u": "Sinds de wijziging van 2022 zien deze artikelen alleen op de hond als geweldmiddel.", "c": false}, {"t": "Ja, en de inzet moet als geweld worden gemeld", "u": "Er is geen geweld aangewend. Het meldingsschema spreekt van melden bij daadwerkelijk bijten.", "c": false}, {"t": "Nee: de hond is geen geweldmiddel", "u": "De hond kan wel als geweldmiddel worden ingezet; dan gelden art. 15 tot en met 15b.", "c": false}]}, {"v": "Na een melding van vernielde auto's in een woonwijk wijzen getuigen een man aan als dader. De hondengeleider wil hem aanhouden, maar hij rent weg. Vernieling heeft een strafmaximum van twee jaar. Mag de surveillancehond als geweldmiddel worden ingezet om hem aan te houden?", "art": "Art. 15a lid 1 sub b Ambtsinstructie", "o": [{"t": "Nee: bij onttrekken is een misdrijf met vier jaar of meer gevangenisstraf vereist", "u": "Onderdeel b stelt die eis. De drie aanvullende eisen van het vuurwapen gelden bij de hond niet.", "c": true}, {"t": "Ja: onttrekken aan aanhouding is voldoende, zoals bij de wapenstok", "u": "Bij wapenstok, pepperspray en stroomstootwapen volstaat onttrekken; bij de hond niet.", "c": false}, {"t": "Ja, mits de hond aangelijnd blijft", "u": "Aanlijnen is de eis bij het verspreiden van een menigte, niet bij aanhouden.", "c": false}, {"t": "Nee: de hond mag alleen worden ingezet tegen personen met een vuurwapen", "u": "Dat is onderdeel a. Ook onderdeel b en de afweerbevoegdheid zijn gronden.", "c": false}]}, {"v": "Wat eist art. 15a lid 1 sub a voor de inzet van de hond om een gevaarlijke persoon aan te houden?", "art": "Art. 15a lid 1 sub a Ambtsinstructie", "o": [{"t": "Een gereed vuurwapen dat hij tegen personen zal gebruiken, of aanstonds ander geweld", "u": "Voluit: een voor onmiddellijk gebruik gereed zijnd vuurwapen. De hond deelt 'vuurwapen' met het vuurwapenartikel, maar bij het andere geweld ontbreekt het woord levensbedreigend.", "c": true}, {"t": "Een gereed wapen dat hij tegen personen zal gebruiken, of aanstonds ander levensbedreigend geweld", "u": "Omgedraaid: er staat 'vuurwapen' en 'ander geweld'.", "c": false}, {"t": "Een verdenking van een misdrijf met vier jaar of meer gevangenisstraf", "u": "Dat is de eis van onderdeel b.", "c": false}, {"t": "Toestemming van het bevoegd gezag voor de aanhouding van deze persoon", "u": "Toestemming speelt bij de mobiele eenheid en de AOT-hond (art. 15), niet als onderdeel van deze grond.", "c": false}]}, {"v": "Na een voetbalwedstrijd lopen de rellen op: een menigte gooit met stenen naar omstanders. De commandant besluit de surveillancehond in te zetten om de menigte te verspreiden. Welke eis stelt art. 15a lid 2 aan de manier van inzetten?", "art": "Art. 15a lid 2 Ambtsinstructie", "o": [{"t": "De hond wordt aangelijnd ingezet", "u": "Lid 2 schrijft dat voor. De menigte moet een ernstige en onmiddellijke bedreiging vormen voor de veiligheid van personen of zaken.", "c": true}, {"t": "De hond wordt los ingezet, voor een groter afschrikwekkend effect", "u": "Het tegenovergestelde van wat lid 2 voorschrijft.", "c": false}, {"t": "De hond draagt een muilkorf", "u": "Een muilkorf noemt de Ambtsinstructie niet.", "c": false}, {"t": "Alleen een AOT-hond mag hiervoor worden gebruikt", "u": "Lid 2 geldt voor de surveillancehond en de AOT-hond.", "c": false}]}, {"v": "Onder welke voorwaarde mag een surveillancehond bij de surveillancedienst als geweldmiddel worden ingezet?", "art": "Art. 15 lid 1 Ambtsinstructie", "o": [{"t": "Onder direct en voortdurend toezicht van een geleider", "u": "Dat geldt voor elke inzet als geweldmiddel. Toestemming van het bevoegd gezag is nodig bij de mobiele eenheid en bij de AOT-hond.", "c": true}, {"t": "Na toestemming van het bevoegd gezag", "u": "Die eis geldt bij optreden van de mobiele eenheid en voor de AOT-hond, niet bij de surveillancedienst.", "c": false}, {"t": "Na toestemming van de hOvJ", "u": "De hOvJ komt in art. 15 niet voor.", "c": false}, {"t": "Alleen in aanwezigheid van een tweede geleider", "u": "De Ambtsinstructie eist één geleider die direct en voortdurend toezicht houdt.", "c": false}]}, {"v": "Hoe waarschuw je voordat je de hond tegen een persoon inzet?", "art": "Art. 15b Ambtsinstructie", "o": [{"t": "Duidelijk maken dat de hond wordt ingezet als het bevel niet wordt opgevolgd", "u": "Met luide stem of op andere niet mis te verstane wijze. Achterwege laten kan alleen als de omstandigheden de waarschuwing redelijkerwijs niet toelaten. De syllabus noemt het laten blaffen van de hond als mogelijke andere wijze.", "c": true}, {"t": "Driemaal waarschuwen, met telkens enkele seconden tussenpoos", "u": "De wet noemt geen aantal en geen tussenpoos.", "c": false}, {"t": "Niet: voor de hond schrijft de Ambtsinstructie geen waarschuwing voor", "u": "Art. 15b schrijft haar voor.", "c": false}, {"t": "Niet zelf: alleen de meerdere mag voor de hond waarschuwen", "u": "De ambtenaar waarschuwt zelf. Alleen bij de wapenstok noemt de wet ook de meerdere.", "c": false}]}, {"v": "Na een melding van een vechtpartij houd je een verdachte aan. Hij verzet zich en je geeft hem een vuiststoot in de maag om zijn verzet te breken. Daarna is hij onder controle; hij heeft geen letsel. Wat moet je doen?", "art": "Art. 17 lid 1 Ambtsinstructie", "o": [{"t": "Zo spoedig mogelijk melden aan de hOvJ, schriftelijk en mondeling", "u": "Elk aanwenden van geweld wordt gemeld, ook zonder letsel: schriftelijk de aard en de gevolgen (in de praktijk met het i8-formulier), mondeling de feiten, omstandigheden en redenen. Daarnaast vermeld je het geweld in het proces-verbaal (art. 152 Sv).", "c": true}, {"t": "Niets: zonder letsel bestaat er geen plicht om geweld te melden", "u": "Letsel is een criterium voor de registratie door de hOvJ, niet voor jouw melding.", "c": false}, {"t": "Alleen vermelden in het proces-verbaal van aanhouding", "u": "Het proces-verbaal komt naast de melding en vervangt haar niet.", "c": false}, {"t": "Onverwijld melden aan de officier van justitie", "u": "Je meldt aan de hOvJ. Kennisgeving aan de officier loopt via de korpschef, in de gevallen van art. 18.", "c": false}]}, {"v": "Een gekraakt pand wordt ontruid. Je groep treedt op onder leiding van een aanwezige groepscommandant, de krakers verzetten zich. Op zijn uitdrukkelijke last gebruik je de wapenstok. Wie doet de geweldsmelding?", "art": "Art. 17 lid 2 Ambtsinstructie", "o": [{"t": "De meerdere die de last gaf; jij geeft de hOvJ desgevraagd inlichtingen", "u": "Dat bepaalt lid 2 voor geweld na uitdrukkelijke last van een ter plaatse aanwezige meerdere.", "c": true}, {"t": "Jij, want jij hebt het geweld aangewend", "u": "Hoofdregel van lid 1, maar lid 2 maakt hier een uitzondering.", "c": false}, {"t": "Niemand: geweld op last van een meerdere wordt niet gemeld", "u": "De melding blijft verplicht; alleen de melder verschilt.", "c": false}, {"t": "Jij en de meerdere, ieder afzonderlijk", "u": "Lid 2 legt de melding bij de meerdere.", "c": false}]}, {"v": "Na een melding van een vechtpartij houd je een man aan. Tijdens de worsteling gebruik je geweld; hij krijgt een snee in zijn wenkbrauw die in het ziekenhuis wordt gehecht. Moet de hOvJ de melding registreren?", "art": "Art. 17 lid 3 sub a Ambtsinstructie", "o": [{"t": "Ja: het is lichamelijk letsel van meer dan geringe betekenis", "u": "Daaronder valt letsel dat door een arts of verpleegkundige is of zou moeten worden behandeld. Een enkele blauwe plek of schram niet.", "c": true}, {"t": "Nee: registratie volgt alleen bij zwaar lichamelijk letsel", "u": "Zwaar lichamelijk letsel is de drempel voor de kennisgeving aan de officier van justitie (art. 18).", "c": false}, {"t": "Nee: registratie volgt alleen als een geweldmiddel is gebruikt", "u": "Het letsel is bepalend, niet het middel.", "c": false}, {"t": "Alleen als de verdachte een klacht indient", "u": "Een klacht is geen voorwaarde.", "c": false}]}, {"v": "Na een melding van een gewapende overval vlucht een verdachte. Je roept dat je zult schieten en lost een waarschuwingsschot in de grond. Niemand raakt gewond. Wat geldt voor de registratie?", "art": "Art. 1 lid 4 sub j en art. 17 lid 3 sub b Ambtsinstructie", "o": [{"t": "De hOvJ registreert altijd, omdat een vuurwapen is gebruikt", "u": "Een waarschuwingsschot is schieten en dus gebruik van het vuurwapen. Gebruik van een vuurwapen is een zelfstandige grond voor registratie.", "c": true}, {"t": "Registratie is niet nodig, omdat er geen letsel is", "u": "Letsel is een andere grond (sub a).", "c": false}, {"t": "Registratie is niet nodig, omdat een waarschuwingsschot een waarschuwing is en geen geweld", "u": "Het schot vervangt de waarschuwing, maar is zelf gebruik van het vuurwapen.", "c": false}, {"t": "De hOvJ beslist naar eigen oordeel of hij registreert", "u": "Dat is de restgrond (sub c). Bij vuurwapengebruik is registratie verplicht.", "c": false}]}, {"v": "In welk geval wordt van de geweldsregistratie terstond kennis gegeven aan de officier van justitie?", "art": "Art. 18 lid 2 sub a Ambtsinstructie", "o": [{"t": "Bij de dood, zwaar lichamelijk letsel of vuurwapengebruik met enig letsel", "u": "Ook als ernstig rekening moet worden gehouden met zwaar lichamelijk letsel. In andere gevallen zo spoedig mogelijk, als de korpschef daartoe aanleiding ziet.", "c": true}, {"t": "Bij elk gebruik van een geweldmiddel tegen een persoon", "u": "Dat leidt tot een melding en soms tot registratie, niet automatisch tot kennisgeving.", "c": false}, {"t": "Bij elk lichamelijk letsel van meer dan geringe betekenis", "u": "Dat is de drempel voor registratie door de hOvJ.", "c": false}, {"t": "Alleen als de verdachte aangifte doet tegen de ambtenaar", "u": "Aangifte is geen criterium.", "c": false}]}, {"v": "Na een melding van winkeldiefstal heb je de verdachte aangehouden. Voor het vervoer naar het bureau boei je hem. Hij werkt mee; je gebruikt geen kracht. Welke melding hoort hierbij?", "art": "Art. 23 Ambtsinstructie", "o": [{"t": "Onverwijld schriftelijk aan de hOvJ, met de redenen", "u": "Het gebruik van een vrijheidsbeperkend middel wordt gemeld op grond van art. 23. Het is geen geweldsmelding.", "c": true}, {"t": "Een geweldsmelding op grond van art. 17", "u": "Zonder weerstand is boeien geen geweld. Art. 17 geldt pas als je bij het boeien geweld gebruikt.", "c": false}, {"t": "Geen: handboeien horen standaard bij een aanhouding", "u": "Standaard boeien is niet toegestaan, en het gebruik wordt altijd gemeld.", "c": false}, {"t": "Een mondelinge melding aan de officier van dienst", "u": "De wet schrijft een schriftelijke melding aan de hOvJ voor.", "c": false}]}, {"v": "Na een melding van een steekpartij houd je een verdachte aan en tast je hem oppervlakkig af. In de jaszak voel je een hard, langwerpig voorwerp dat een mes kan zijn. Mag je het uit de zak halen?", "art": "Art. 20 Ambtsinstructie (toelichting)", "o": [{"t": "Ja: dat hoort bij de fouillering", "u": "Het voorwerp uit de kleding halen om te zien of het gevaarlijk is, hoort bij de bevoegdheid. Pas als je het ziet, bepaal je of het in bewaring of in beslag wordt genomen.", "c": true}, {"t": "Nee: aftasten is beperkt tot de buitenkant van de kleding", "u": "Het aftasten gebeurt aan de buitenkant, maar een verdacht voorwerp mag je eruit halen.", "c": false}, {"t": "Nee: daarvoor is toestemming van de betrokkene nodig", "u": "De betrokkene moet het onderzoek dulden.", "c": false}, {"t": "Ja, maar alleen met machtiging van de officier van justitie", "u": "Een machtiging is niet vereist.", "c": false}]}, {"v": "Wat bepaalt art. 20 over het geslacht van de ambtenaar die de kleding aftast?", "art": "Art. 20 lid 1 Ambtsinstructie", "o": [{"t": "Het onderzoek wordt zo veel mogelijk uitgevoerd door een ambtenaar van hetzelfde geslacht", "u": "'Zo veel mogelijk': het is een inspanningsplicht. Bij onmiddellijk gevaar hoef je niet te wachten.", "c": true}, {"t": "Het onderzoek mag uitsluitend door een ambtenaar van hetzelfde geslacht worden uitgevoerd", "u": "De tekst zegt 'zo veel mogelijk', niet 'uitsluitend'.", "c": false}, {"t": "Het geslacht van de ambtenaar speelt geen rol", "u": "De wet noemt het geslacht uitdrukkelijk.", "c": false}, {"t": "De betrokkene mag zelf kiezen wie hem fouilleert", "u": "Een keuzerecht kent de wet niet.", "c": false}]}, {"v": "Je hebt een veiligheidsfouillering uitgevoerd en niets gevonden. Moet je iets melden?", "art": "Art. 21 Ambtsinstructie", "o": [{"t": "Ja: onverwijld schriftelijk aan de hOvJ, met de redenen voor het onderzoek", "u": "De meldplicht geldt voor elke veiligheidsfouillering, ongeacht de uitkomst.", "c": true}, {"t": "Nee: melden hoeft alleen als iets is aangetroffen", "u": "Art. 21 maakt dat onderscheid niet.", "c": false}, {"t": "Nee: fouilleringen zijn standaardbevoegdheden zonder meldplicht", "u": "Dat geldt voor de vervoersfouillering, niet voor de veiligheidsfouillering.", "c": false}, {"t": "Ja: mondeling aan de burgemeester", "u": "De melding is schriftelijk en gaat naar de hOvJ.", "c": false}]}, {"v": "Je wordt gestuurd naar een verwarde man die op straat ronddoolt; de meldkamer heeft ook een ambulance gestuurd. De man werkt mee en gaat zonder politiebegeleiding met de ambulance mee. Het ambulancepersoneel vraagt je hem eerst te fouilleren. Kan dat op grond van de vervoersfouillering?", "art": "Art. 7 lid 4 Politiewet 2012 (toelichting syllabus)", "o": [{"t": "Nee: de vervoersfouillering ziet op vervoer door de politie", "u": "Volgens de syllabus is zij hier onrechtmatig. Er kan wel een bevoegdheid bestaan op grond van de Wet verplichte ggz, of een veiligheidsfouillering bij onmiddellijk gevaar.", "c": true}, {"t": "Ja: iedere persoon die wordt vervoerd, mag worden gefouilleerd", "u": "De bevoegdheid geldt voor personen die door de politie worden vervoerd of ingesloten.", "c": false}, {"t": "Ja, als het ambulancepersoneel erom vraagt", "u": "Een verzoek van derden schept geen bevoegdheid.", "c": false}, {"t": "Nee: verwarde personen mogen nooit worden gefouilleerd", "u": "Te absoluut; andere grondslagen kunnen van toepassing zijn.", "c": false}]}, {"v": "Na een melding van winkeldiefstal heb je een verdachte aangehouden. Hij is rustig en werkt mee, maar moet wel naar het bureau. Een collega zegt: 'Boeien, dat doen we altijd.' Wat zegt art. 22?", "art": "Art. 22 Ambtsinstructie", "o": [{"t": "Boeien mag alleen bij gevaar voor ontvluchting of voor de veiligheid", "u": "Dat gevaar moet op grond van feiten of omstandigheden redelijkerwijs te vrezen zijn. Standaard boeien is niet toegestaan; de reden moet je kunnen noemen en melden.", "c": true}, {"t": "Boeien mag altijd bij vervoer van een aangehouden verdachte", "u": "De wet eist een concrete reden.", "c": false}, {"t": "Boeien mag alleen bij misdrijven met vier jaar of meer gevangenisstraf", "u": "Die eis hoort bij vuurwapen en hond.", "c": false}, {"t": "Boeien mag alleen na toestemming van de hOvJ", "u": "De ambtenaar beslist zelf en meldt het achteraf aan de hOvJ.", "c": false}]}, {"v": "Na een melding van overlast schopt een aangehouden verdachte op straat wild om zich heen. Je boeit ook zijn enkels met een tweede paar handboeien. Onder welke bevoegdheid valt dat?", "art": "Art. 7 lid 1 en lid 7 Politiewet 2012 (toelichting bij art. 22 Ambtsinstructie)", "o": [{"t": "De algemene geweldsbevoegdheid van art. 7 lid 1 en 7 Politiewet", "u": "Volgens de syllabus valt het boeien van de benen niet onder art. 22 of 35a. Bij insluiting worden de boeien vervangen door de hulpmiddelen van art. 35a.", "c": true}, {"t": "Art. 22 Ambtsinstructie: handboeien voor vervoer of verplaatsing", "u": "Art. 22 ziet op handboeien om de polsen.", "c": false}, {"t": "Art. 35a Ambtsinstructie: hulpmiddelen jegens ingeslotenen", "u": "Art. 35a geldt voor ingeslotenen en voor de vijf middelen van de limitatieve lijst.", "c": false}, {"t": "Geen: benen boeien is nooit toegestaan", "u": "Het kan, mits proportioneel, subsidiair, redelijk en gematigd.", "c": false}]}, {"v": "Je hebt een man aangehouden na een melding van overlast. Hij staat bekend als 'spuger': vorig jaar bespuugde hij een collega. Nu is hij rustig en werkt hij mee. Mag je hem voor het vervoer mondafscherming aanbrengen?", "art": "Art. 22a Ambtsinstructie", "o": [{"t": "Nee: één incident van vorig jaar is te weinig; de feiten en omstandigheden moeten het redelijkerwijs vereisen", "u": "Een bekende die de ambtenaar recent meermaals bespuugde kan wel aanleiding zijn voor een preventief spuugmasker. Eén incident van vorig jaar is volgens de toelichting te weinig.", "c": true}, {"t": "Ja: wie eerder heeft gespuugd, mag altijd preventief mondafscherming krijgen", "u": "Niet altijd: er moeten feiten of omstandigheden zijn die het redelijkerwijs vereisen, bijvoorbeeld recent meermaals bespuugd.", "c": false}, {"t": "Ja: mondafscherming mag bij elk vervoer", "u": "Art. 22a lid 2 eist dat de omstandigheden het vereisen voor de veiligheid.", "c": false}, {"t": "Nee: mondafscherming mag alleen in de cel", "u": "Art. 22a ziet juist op vervoer en verplaatsing.", "c": false}]}, {"v": "De meldkamer meldt een onderkoelde, dronken man op straat. Met zijn instemming is hij op het bureau ondergebracht voor hulpverlening. Bij het overbrengen naar een opvang wil een collega hem boeien 'omdat hij anders wegloopt'. Mag dat?", "art": "Art. 22b Ambtsinstructie", "o": [{"t": "Nee: bij hulpverlening geldt de ontvluchtingsgrond niet", "u": "Art. 22b verklaart alleen art. 22 onder b (veiligheid) en art. 22a van toepassing. De man is niet van zijn vrijheid beroofd en mag gaan.", "c": true}, {"t": "Ja: gevaar voor ontvluchting is een grond voor handboeien", "u": "Dat geldt voor personen die rechtens van hun vrijheid zijn beroofd.", "c": false}, {"t": "Ja, mits de hOvJ toestemming geeft", "u": "Toestemming schept geen grond die de wet uitsluit.", "c": false}, {"t": "Nee: bij hulpverlening mogen nooit handboeien worden gebruikt", "u": "Bij gevaar voor de veiligheid kan het wel.", "c": false}]}, {"v": "Hoe doe je in de praktijk de schriftelijke melding van aangewend geweld en van het gebruik van handboeien, volgens de les?", "art": "Art. 17 lid 1 en art. 23 Ambtsinstructie; lesdeck (mei 2023)", "o": [{"t": "Met het i8-formulier, aan de hOvJ", "u": "De wet schrijft de schriftelijke melding aan de hOvJ voor; het i8-formulier is de vorm die de les noemt. Bij geweld komt daar de mondelinge toelichting bij.", "c": true}, {"t": "Alleen met een mutatie in het dagrapport", "u": "De wet vraagt een melding aan de hOvJ.", "c": false}, {"t": "Alleen in het proces-verbaal van aanhouding", "u": "Het proces-verbaal komt naast de melding.", "c": false}, {"t": "Met een e-mail aan de officier van justitie", "u": "Je meldt aan de hOvJ, niet aan de officier van justitie.", "c": false}]}, {"v": "In welke drie gevallen registreert de hOvJ een geweldsmelding?", "art": "Art. 17 lid 3 Ambtsinstructie", "o": [{"t": "Dood of letsel van meer dan geringe betekenis, vuurwapengebruik, of als de hOvJ daartoe aanleiding ziet", "u": "Dat zijn de onderdelen a, b en c van lid 3.", "c": true}, {"t": "Dood of zwaar lichamelijk letsel, vuurwapengebruik met letsel, of een klacht", "u": "Dit lijkt op de drempel van art. 18 voor de kennisgeving aan de officier van justitie.", "c": false}, {"t": "Elk gebruik van een geweldmiddel, elk letsel, of een verzoek van de verdachte", "u": "Niet elk gebruik van een geweldmiddel leidt tot registratie.", "c": false}, {"t": "Alleen bij vuurwapengebruik", "u": "Ook letsel van meer dan geringe betekenis en het oordeel van de hOvJ zijn gronden.", "c": false}]}, {"v": "Waar voer je een veiligheids- of vervoersfouillering bij voorkeur uit, volgens de les?", "art": "Art. 20 Ambtsinstructie; lesdeck (mei 2023)", "o": [{"t": "Zo veel mogelijk uit het zicht van anderen", "u": "Dat staat niet in art. 20, maar wordt in de les als aandachtspunt genoemd. Art. 20 noemt het oppervlakkig aftasten en hetzelfde geslacht.", "c": true}, {"t": "Altijd op het bureau", "u": "Een veiligheidsfouillering is juist bedoeld voor onmiddellijk gevaar ter plaatse.", "c": false}, {"t": "Altijd in het bijzijn van een hOvJ", "u": "De hOvJ krijgt achteraf de melding van de veiligheidsfouillering.", "c": false}, {"t": "Dat maakt niet uit", "u": "De les noemt het uit het zicht fouilleren als aandachtspunt.", "c": false}]}]}, {"key": "afweer", "title": "Afweer en strafrecht", "sub": "Afweerbevoegdheid, strafuitsluiting, art. 35a", "notes": "<h2>Afweerbevoegdheid<\/h2>\n<p>Een geweldmiddel mag worden gebruikt om <strong>direct gevaar voor het leven van personen of voor het ontstaan van zwaar lichamelijk letsel<\/strong> af te wenden.<\/p>\n<p><strong>Waar staat zij?<\/strong> In elk middelartikel: vuurwapen art. 7 lid 1 sub f, pepperspray art. 12a sub d, SSW art. 12c lid 1 sub d en lid 2 sub b, wapenstok art. 12e sub e, hond art. 15a lid 1 sub c. Het is dus geen losse bevoegdheid maar een <strong>doel binnen de geweldsbevoegdheid<\/strong>.<\/p>\n<p><strong>Direct gevaar<\/strong> betekent:<\/p>\n<ul>\n<li>uit feiten of omstandigheden blijkt een <strong>concreet en serieus risico<\/strong>;<\/li>\n<li>dat zich op zo korte termijn zal verwezenlijken dat <strong>onmiddellijk ingrijpen<\/strong> nodig is: hier en nu.<\/li>\n<\/ul>\n<p><strong>Voor wie?<\/strong> Voor jezelf, voor derden en ook voor <strong>de persoon van wie het gevaar uitgaat<\/strong>, bijvoorbeeld bij dreigende zelfdoding. Het gevaar kan ook van een dier komen.<\/p>\n<p><strong>Grenzen:<\/strong><\/p>\n<ul>\n<li>alleen bij gevaar voor leven of zwaar lichamelijk letsel, dus niet bij zaakschade of licht letsel;<\/li>\n<li>proportionaliteit, subsidiariteit, redelijkheid en gematigdheid gelden onverkort, ook voor omstanders;<\/li>\n<li>na de inzet hoeft niet al het gevaar weg te zijn, wel het <strong>directe<\/strong> gevaar;<\/li>\n<li>gebruik je geen aangewezen geweldmiddel (dienstauto, bezem), dan val je terug op art. 7 lid 1 en 7 Politiewet.<\/li>\n<\/ul>\n<p><strong>In het proces-verbaal<\/strong> verantwoord je waarom je het middel ter afwending gebruikte en niet om aan te houden: wat was je intentie?<\/p>\n<h2>Strafrechtelijk kader sinds 1 juli 2022<\/h2>\n<ul>\n<li><strong>Art. 42 lid 2 Sr<\/strong>: niet strafbaar is de ambtenaar die in de rechtmatige uitoefening van zijn taak en in overeenstemming met zijn geweldsinstructie geweld gebruikt.<\/li>\n<li><strong>Art. 372 Sr<\/strong>: schending van de geweldsinstructie. Een <strong>schulddelict<\/strong>: ten hoogste één jaar bij enig lichamelijk letsel, twee jaar bij zwaar lichamelijk letsel, drie jaar bij de dood. Bij opzet blijven de gewone geweldsdelicten mogelijk.<\/li>\n<li><strong>Feitenonderzoek<\/strong> (art. 511a Sv): de officier van justitie kan onderzoek laten doen naar de vraag of volgens de geweldsinstructie is gehandeld, zonder dat de ambtenaar direct verdachte is.<\/li>\n<li>Zaken worden behandeld door de rechtbank Midden-Nederland.<\/li>\n<\/ul>\n<p>Door de afweerbevoegdheid is een beroep op noodweer veel minder vaak nodig: wie zich aan de instructie houdt, valt onder art. 42 Sr.<\/p>\n<h2>Strafuitsluitingsgronden<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Artikel<\/th>\n<th>Grond<\/th>\n<th>Kern<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>40 Sr<\/td>\n<td><strong>Overmacht<\/strong><\/td>\n<td>Noodtoestand: conflict van plichten of belangen in een concrete nood, waarbij een zwaarder belang voorgaat<\/td>\n<\/tr>\n<tr>\n<td>41 lid 1 Sr<\/td>\n<td><strong>Noodweer<\/strong><\/td>\n<td>Noodzakelijke verdediging van eigen of andermans lijf, eerbaarheid of goed tegen <strong>ogenblikkelijke, wederrechtelijke aanranding<\/strong><\/td>\n<\/tr>\n<tr>\n<td>41 lid 2 Sr<\/td>\n<td><strong>Noodweerexces<\/strong><\/td>\n<td>Overschrijding van de grenzen van de verdediging als onmiddellijk gevolg van een <strong>hevige gemoedsbeweging<\/strong> door de aanranding<\/td>\n<\/tr>\n<tr>\n<td>42 Sr<\/td>\n<td><strong>Wettelijk voorschrift<\/strong><\/td>\n<td>Handelen ter uitvoering van de wet; lid 2 voor geweld volgens de geweldsinstructie<\/td>\n<\/tr>\n<tr>\n<td>43 Sr<\/td>\n<td><strong>Ambtelijk bevel<\/strong><\/td>\n<td>Bevel van het bevoegde gezag. Een onbevoegd bevel beschermt alleen bij goede trouw én nakoming binnen de kring van ondergeschiktheid<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Noodweer in vier punten:<\/strong><\/p>\n<ul>\n<li><strong>Wederrechtelijk<\/strong>: tegen een rechtmatige ambtshandeling is geen noodweer mogelijk.<\/li>\n<li><strong>Ogenblikkelijk<\/strong>: de aanranding is begonnen of dreigt onmiddellijk.<\/li>\n<li><strong>Noodzakelijk<\/strong>: de burger moet zich zo mogelijk onttrekken; van de politieambtenaar wordt verwacht dat hij niet wegloopt maar nagaat of anderen gevaar lopen (hof Amsterdam 2005).<\/li>\n<li><strong>Putatief noodweer<\/strong>: je mocht redelijkerwijs denken dat je werd aangevallen, al bleek dat achteraf niet zo.<\/li>\n<\/ul>\n<p>Noodweerexces bestaat alleen als er eerst een noodweersituatie was.<\/p>\n<h2>Hulpmiddelen jegens ingeslotenen (art. 35a AI)<\/h2>\n<p><strong>Ingeslotene<\/strong>: wie rechtens van zijn vrijheid is beroofd, en ook wie voor hulpverlening op het bureau is ondergebracht.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Lid<\/th>\n<th>Regel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Na <strong>toestemming van de hOvJ<\/strong>: ten hoogste <strong>24 uur<\/strong>, in de cel of voor vervoer of verplaatsing<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Bij spoed zonder toestemming vooraf: ten hoogste <strong>3 uur<\/strong>; hOvJ onverwijld informeren, die beslist over voortzetting<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>Arts<\/strong> onverwijld informeren<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Afzondering en <strong>permanente camera-observatie<\/strong> (bij vervoer: camera of permanente observatie door de ambtenaar)<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Alleen bij gevaar voor ernstige verstoring van orde en veiligheid in cel of cellencomplex, of voor de veiligheid van ingeslotene, ambtenaar of derden<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Verlengen met telkens ten hoogste 24 uur: toestemming hOvJ, na overleg met de arts<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Limitatieve lijst<\/strong> (art. 2 lid 5 Besluit bewapening en uitrusting politie): gecapitonneerde helm, gecapitonneerde handschoenen, mondafscherming, polsbanden, enkelbanden met tussenstuk.<\/p>\n<p>Volgens de syllabus is de toepassing voorbehouden aan de ambtenaar die met de zorg voor ingeslotenen is belast. Collega's die helpen fixeren, handelen op grond van art. 7 lid 1 en 7 Politiewet.<\/p>\n<h2>Veelgemaakte fouten<\/h2>\n<ol>\n<li>De afweerbevoegdheid zien als vrijbrief: zij geldt alleen bij direct gevaar voor leven of zwaar letsel.<\/li>\n<li>Noodweerexces inroepen zonder noodweersituatie.<\/li>\n<li>24 uur en 3 uur bij art. 35a verwisselen.<\/li>\n<li>Andere middelen dan de vijf van de lijst gebruiken in de cel.<\/li>\n<\/ol>", "quiz": [{"v": "Wanneer mag een geweldmiddel op grond van de afweerbevoegdheid worden gebruikt?", "art": "Bijlage 2 syllabus; o.a. art. 7 lid 1 sub f Ambtsinstructie", "o": [{"t": "Om direct gevaar voor het leven of voor zwaar lichamelijk letsel af te wenden", "u": "Zo luidt de grond in elk middelartikel. Proportionaliteit, subsidiariteit, redelijkheid en gematigdheid blijven gelden.", "c": true}, {"t": "Om elk gevaar voor de veiligheid van personen of goederen af te wenden", "u": "Te ruim: het gaat om leven of zwaar lichamelijk letsel, en om personen.", "c": false}, {"t": "Om een ogenblikkelijke, wederrechtelijke aanranding af te weren", "u": "Dat is de omschrijving van noodweer (art. 41 Sr).", "c": false}, {"t": "Om een verdachte aan te houden van wie levensgevaar uitgaat", "u": "Aanhouden is een ander doel. Bij afweer gaat het om het wegnemen van gevaar.", "c": false}]}, {"v": "Hoe verhoudt de afweerbevoegdheid zich tot de geweldsbevoegdheid?", "art": "Bijlage 2 syllabus", "o": [{"t": "Zij is een doel binnen de geweldsbevoegdheid, opgenomen bij elk geweldmiddel", "u": "Eerst moet zijn voldaan aan art. 7 lid 1 en 7 Politiewet, daarna aan de afweergrond bij het gekozen middel. Het is geen bevoegdheid op zich.", "c": true}, {"t": "Zij is een zelfstandige bevoegdheid naast art. 7 Politiewet", "u": "Zij maakt deel uit van de geweldsbevoegdheid.", "c": false}, {"t": "Zij is een strafuitsluitingsgrond uit het Wetboek van Strafrecht", "u": "Zij staat in de Ambtsinstructie. De strafuitsluitingsgrond die daarbij past is art. 42 Sr.", "c": false}, {"t": "Zij geldt alleen voor aanhoudings- en ondersteuningsteams", "u": "Zij geldt voor iedere ambtenaar aan wie het middel is toegekend.", "c": false}]}, {"v": "Wat houdt 'direct gevaar' in?", "art": "Bijlage 2 syllabus", "o": [{"t": "Een concreet, serieus risico dat onmiddellijk ingrijpen nodig maakt", "u": "Het risico moet blijken uit feiten en omstandigheden en zich op zo korte termijn verwezenlijken dat van ingrijpen niet kan worden afgezien: hier en nu.", "c": true}, {"t": "Een gevaar dat zich al volledig heeft verwezenlijkt", "u": "Dan valt er niets meer af te wenden.", "c": false}, {"t": "Elk risico dat de ambtenaar zelf als bedreigend ervaart", "u": "Het gevaar moet uit feiten en omstandigheden blijken.", "c": false}, {"t": "Een gevaar dat zich binnen afzienbare tijd kan voordoen", "u": "Te ruim: er moet direct gehandeld moeten worden.", "c": false}]}, {"v": "De meldkamer meldt een man op een balkon die een mes op zijn eigen keel zet. Je komt ter plaatse; hij begint te snijden en praten helpt niet. Geldt de afweerbevoegdheid ook als het gevaar alleen hemzelf treft?", "art": "Bijlage 2 syllabus; art. 12c lid 1 sub d Ambtsinstructie", "o": [{"t": "Ja: het maakt niet uit wiens leven in gevaar is, ook niet als dat de veroorzaker zelf is", "u": "De syllabus noemt dreigende zelfdoding als voorbeeld. De keuze van het middel blijft een afweging; denk hier aan het valgevaar.", "c": true}, {"t": "Nee: de afweerbevoegdheid beschermt alleen de ambtenaar en derden", "u": "Zij geldt ook voor de persoon van wie het gevaar uitgaat.", "c": false}, {"t": "Nee: tegen iemand die alleen zichzelf bedreigt, mag geen geweld worden gebruikt", "u": "Het leven van de betrokkene is juist het te beschermen belang.", "c": false}, {"t": "Ja, maar alleen met het vuurwapen", "u": "De afweerbevoegdheid staat bij elk geweldmiddel.", "c": false}]}, {"v": "De meldkamer meldt een bestuurder die in een winkelstraat op voetgangers inrijdt. Je zet de achtervolging in en ziet hem opnieuw op een groep voetgangers afrijden. Je ramt hem met je dienstauto van de weg. Op welke bevoegdheid berust dit geweld?", "art": "Bijlage 2 syllabus; art. 7 lid 1 en lid 7 Politiewet 2012", "o": [{"t": "Op art. 7 lid 1 en 7 Politiewet", "u": "Een dienstauto is geen aangewezen geweldmiddel. De afweerbevoegdheid van de Ambtsinstructie hoort bij de daar genoemde middelen; gebruik je iets anders, dan val je terug op de Politiewet.", "c": true}, {"t": "Op de afweerbevoegdheid van de Ambtsinstructie", "u": "Die is gekoppeld aan de aangewezen geweldmiddelen.", "c": false}, {"t": "Op art. 4 Ambtsinstructie", "u": "Art. 4 regelt wie een toegekend middel mag gebruiken.", "c": false}, {"t": "Op geen enkele: geweld met een voertuig is niet toegestaan", "u": "Het kan onder art. 7 Politiewet vallen, mits proportioneel, subsidiair, redelijk en gematigd.", "c": false}]}, {"v": "Er komt een melding van vernieling binnen. Je komt ter plaatse en ziet een man in een verlaten straat met een honkbalknuppel de ruiten van geparkeerde auto's inslaan. Er is niemand in de buurt. Geeft de afweerbevoegdheid een grond om geweld te gebruiken?", "art": "Bijlage 2 syllabus", "o": [{"t": "Nee: er is geen direct gevaar voor leven of lijf", "u": "De afweerbevoegdheid geldt alleen bij direct gevaar voor leven of zwaar lichamelijk letsel van personen. Schade aan zaken valt er niet onder. Voor een aanhouding gelden de gewone aanhoudingsgronden van de middelartikelen.", "c": true}, {"t": "Ja: de afweerbevoegdheid beschermt ook goederen", "u": "Zij ziet alleen op leven en zwaar lichamelijk letsel van personen.", "c": false}, {"t": "Ja: een knuppel is een wapen, dus er is altijd direct gevaar", "u": "Zonder personen in de buurt is er geen direct gevaar voor leven of lijf.", "c": false}, {"t": "Nee, en er is ook geen andere grond voor geweld", "u": "De aanhoudingsgronden van de middelartikelen kunnen wel van toepassing zijn.", "c": false}]}, {"v": "Een man met een mes bedreigt de bewoners van een flat. Je komt met je collega ter plaatse; hij komt met het mes op haar af en jij gebruikt pepperspray. Hij laat het mes vallen, maar blijft schelden en dreigen. Was het gebruik gericht op het juiste resultaat?", "art": "Bijlage 2 syllabus", "o": [{"t": "Ja: het directe gevaar is afgewend; niet elk gevaar hoeft weg te zijn", "u": "De inzet moet bijdragen aan het wegnemen van het directe gevaar. Voor wat daarna nodig is, maak je een nieuwe afweging.", "c": true}, {"t": "Nee: de afweerbevoegdheid eist dat alle gevaar is geweken", "u": "Die eis stelt de syllabus niet.", "c": false}, {"t": "Nee: tegen een mes had het vuurwapen moeten worden gebruikt", "u": "Er is geen voorgeschreven middel; het lichtste geschikte middel heeft de voorkeur.", "c": false}, {"t": "Ja, mits de man daarna is aangehouden", "u": "Aanhouding is geen voorwaarde voor de afweerbevoegdheid.", "c": false}]}, {"v": "Wat moet je in het proces-verbaal verantwoorden als je een geweldmiddel ter afwending hebt gebruikt?", "art": "Art. 152 Sv; toelichting bij de afweerbevoegdheid in de syllabus", "o": [{"t": "Waarom je het middel ter afwending gebruikte: je intentie en de feiten", "u": "Beschrijf de feiten en omstandigheden waaruit het directe gevaar bleek, zoals afstand, tijd en snelheid.", "c": true}, {"t": "Alleen welk middel je hebt gebruikt en hoe laat", "u": "Zonder de feiten waaruit het gevaar bleek, is het gebruik niet te toetsen.", "c": false}, {"t": "Niets: een beroep op de afweerbevoegdheid hoeft niet te worden gemotiveerd", "u": "De verbaliseringsplicht geldt onverkort.", "c": false}, {"t": "Welke meerdere toestemming gaf", "u": "Voor de afweerbevoegdheid is geen toestemming vereist.", "c": false}]}, {"v": "Na een melding van een vechtpartij houdt een agent een verdachte aan en gebruikt daarbij geweld, in de rechtmatige uitoefening van zijn taak en volgens de geweldsinstructie. Welke bepaling maakt dat hij niet strafbaar is?", "art": "Art. 42 lid 2 Sr", "o": [{"t": "Art. 42 lid 2 Sr", "u": "Sinds 1 juli 2022: niet strafbaar is de ambtenaar die in de rechtmatige uitoefening van zijn taak en in overeenstemming met zijn geweldsinstructie geweld gebruikt.", "c": true}, {"t": "Art. 41 lid 1 Sr (noodweer)", "u": "Noodweer vraagt een ogenblikkelijke, wederrechtelijke aanranding en is hier niet nodig.", "c": false}, {"t": "Art. 40 Sr (overmacht)", "u": "Overmacht ziet op een noodtoestand, niet op een wettelijke bevoegdheid.", "c": false}, {"t": "Art. 372 Sr", "u": "Art. 372 is geen uitsluitingsgrond maar de strafbaarstelling van schending van de geweldsinstructie.", "c": false}]}, {"v": "Wat stelt art. 372 Sr strafbaar?", "art": "Art. 372 Sr", "o": [{"t": "Het door schuld schenden van de geweldsinstructie, met lichamelijk letsel of de dood tot gevolg", "u": "Een schulddelict met ten hoogste een, twee of drie jaar bij enig letsel, zwaar letsel of de dood. Bij opzet blijven de gewone geweldsdelicten mogelijk.", "c": true}, {"t": "Elk gebruik van geweld door een ambtenaar zonder voorafgaande waarschuwing", "u": "Niet elke schending is strafbaar op grond van art. 372; er moet letsel of de dood uit volgen.", "c": false}, {"t": "Het opzettelijk mishandelen van een verdachte", "u": "Opzettelijk geweld wordt vervolgd via de gewone delicten, zoals mishandeling.", "c": false}, {"t": "Het niet melden van aangewend geweld aan de hOvJ", "u": "De meldplicht staat in de Ambtsinstructie; art. 372 ziet op het geweld zelf.", "c": false}]}, {"v": "Bij de aanhouding van een verdachte van woninginbraak neem je rechtmatig zijn telefoon in beslag. Hij geeft je een harde duw en zegt later dat hij zijn eigendom verdedigde. Slaagt een beroep op noodweer?", "art": "Art. 41 lid 1 Sr", "o": [{"t": "Nee: de inbeslagneming is rechtmatig", "u": "Noodweer vraagt een wederrechtelijke aanranding. Tegen een rechtmatige ambtshandeling bestaat geen noodweer.", "c": true}, {"t": "Ja: hij verdedigde zijn goed", "u": "Goed kan worden verdedigd, maar alleen tegen een wederrechtelijke aanranding.", "c": false}, {"t": "Ja, als hij hevig geschrokken was", "u": "Hevige gemoedsbeweging speelt bij noodweerexces, en dat vraagt eerst een noodweersituatie.", "c": false}, {"t": "Nee: noodweer geldt alleen voor het eigen lijf", "u": "Noodweer geldt voor eigen of andermans lijf, eerbaarheid of goed.", "c": false}]}, {"v": "Een man loopt in een eethuis met een mes op de gasten af. Een agent die ter plaatse is, blijft staan en schiet. Later wordt gezegd dat hij eerst had moeten weglopen in plaats van schieten. Hoe oordeelde het hof Amsterdam in de zaak die de syllabus noemt?", "art": "Art. 41 lid 1 Sr; Hof Amsterdam 9 december 2005", "o": [{"t": "Hij hoefde niet weg te lopen: van een politieambtenaar mag worden verwacht dat hij nagaat of ook anderen gevaar lopen", "u": "Het hof: van een politieambtenaar mag worden verwacht dat hij zich bij naderend gevaar niet uit de voeten maakt, maar nagaat of ook anderen slachtoffer kunnen worden.", "c": true}, {"t": "Ook een politieambtenaar moet eerst weglopen als dat veilig kan", "u": "Het hof oordeelde anders.", "c": false}, {"t": "Een politieambtenaar mag zich in geen geval terugtrekken", "u": "Een algeheel verbod om je terug te trekken volgt niet uit de uitspraak. Het gaat om de afweging in deze situatie, waarin ook anderen gevaar liepen.", "c": false}, {"t": "Een politieambtenaar kan zich niet op noodweer beroepen", "u": "Een ambtenaar kan zich op noodweer beroepen, al is dat door de afweerbevoegdheid minder vaak nodig.", "c": false}]}, {"v": "Na een melding van een vechtpartij bij een uitgaansgebied wordt een agent bij een aanhouding aangevallen door een dronken man die hem met vuisten slaat. De agent brengt de aanvaller met een paar klappen naar de grond. Uit pure schrik blijft hij doorslaan terwijl de man al weerloos op de grond ligt. Welke grond komt in beeld?", "art": "Art. 41 lid 2 Sr", "o": [{"t": "Noodweerexces", "u": "Voorwaarde is dat er eerst een noodweersituatie was en dat de overschrijding het onmiddellijke gevolg is van die gemoedsbeweging.", "c": true}, {"t": "Noodweer", "u": "Tegen een weerloze aanvaller is verdediging niet meer noodzakelijk.", "c": false}, {"t": "Putatief noodweer", "u": "Dat gaat over een verschoonbare vergissing over het bestaan van een aanval. Hier was de aanval echt.", "c": false}, {"t": "Overmacht (noodtoestand)", "u": "Noodtoestand is een conflict van plichten, geen reactie op een aanranding.", "c": false}]}, {"v": "Je loopt 's nachts surveillance op een slecht verlicht bedrijventerrein na een melding van een verdachte man bij een loods. Als je hem aanspreekt, draait hij zich plotseling om met een glimmend voorwerp in zijn hand. Je denkt aan een mes en slaat hem met je wapenstok neer. Het blijkt een telefoon. Welk begrip past hier?", "art": "Art. 41 Sr (putatief noodweer)", "o": [{"t": "Putatief noodweer", "u": "Het gaat om een verschoonbare dwaling over het bestaan van een noodweersituatie.", "c": true}, {"t": "Noodweerexces", "u": "Dat vraagt een echte aanranding, die hier ontbrak.", "c": false}, {"t": "Noodweer", "u": "Er was geen werkelijke wederrechtelijke aanranding.", "c": false}, {"t": "Ambtelijk bevel", "u": "Er is geen bevel gegeven.", "c": false}]}, {"v": "Je rijdt met je collega over de snelweg en ziet aan de overkant een auto in brand staan, met de bestuurder bewusteloos erin. Je stopt op de vluchtstrook en steekt te voet over om hem te redden, wat verboden is. Op welke grond kun je je beroepen?", "art": "Art. 40 Sr", "o": [{"t": "Overmacht (noodtoestand)", "u": "Een conflict van plichten: hulp verlenen weegt in deze concrete nood zwaarder dan het verkeersvoorschrift.", "c": true}, {"t": "Noodweer", "u": "Er is geen wederrechtelijke aanranding.", "c": false}, {"t": "Wettelijk voorschrift", "u": "Geen wet draagt je op de snelweg over te steken.", "c": false}, {"t": "Ambtelijk bevel", "u": "Niemand heeft je een bevel gegeven.", "c": false}]}, {"v": "Tijdens een inzet bij een rel geeft je groepscommandant je het bevel een woning binnen te treden, waartoe hij niet bevoegd is. Jij voert het bevel uit en begaat daarmee een strafbaar feit. Wanneer ben jij als ondergeschikte niet strafbaar?", "art": "Art. 43 lid 2 Sr", "o": [{"t": "Bij goede trouw én nakoming binnen de kring van zijn ondergeschiktheid", "u": "Hij moet het bevel te goeder trouw als bevoegd gegeven hebben beschouwd, en de nakoming moet binnen de kring van zijn ondergeschiktheid liggen. Beide voorwaarden gelden samen.", "c": true}, {"t": "Altijd: een bevel van een meerdere moet worden opgevolgd", "u": "Een onbevoegd bevel heft de strafbaarheid in beginsel niet op.", "c": false}, {"t": "Nooit: een onbevoegd bevel kan de strafbaarheid niet wegnemen", "u": "Lid 2 maakt de genoemde uitzondering.", "c": false}, {"t": "Alleen als het bevel schriftelijk was gegeven", "u": "De vorm van het bevel is geen voorwaarde.", "c": false}]}, {"v": "Om 14.30 uur loopt een arrestantenbewaarder de gang van het cellencomplex door en hoort gebonk. Een ingeslotene slaat met zijn hoofd tegen de celmuur, zonder dat hij gewond raakt. Kalmeren helpt niet. De bewaarder wil hem een gecapitonneerde helm opzetten. De dienstdoende hOvJ is telefonisch bereikbaar en de toepassing kan even wachten. Wat is de hoofdregel van art. 35a?", "art": "Art. 35a lid 1 Ambtsinstructie", "o": [{"t": "Na toestemming van de hOvJ, voor ten hoogste 24 uur", "u": "Verlengen kan met telkens ten hoogste 24 uur, met toestemming van de hOvJ en na overleg met de arts.", "c": true}, {"t": "Zonder toestemming, voor ten hoogste 24 uur", "u": "De hoofdregel vraagt toestemming van de hOvJ vooraf.", "c": false}, {"t": "Na toestemming van de officier van justitie, voor ten hoogste 3 uur", "u": "De hOvJ geeft toestemming; drie uur is de spoedtermijn.", "c": false}, {"t": "Na toestemming van de arts, zolang als nodig is", "u": "De arts wordt geïnformeerd en geraadpleegd, maar geeft geen toestemming. De duur is begrensd.", "c": false}]}, {"v": "Om 03.00 uur hoort de arrestantenbewaarder gebonk in het cellencomplex. Een ingeslotene slaat herhaaldelijk met zijn hoofd tegen de celmuur en heeft al een bloedende hoofdwond. Aanspreken en kalmeren helpen niet. De bewaarder wil hem een gecapitonneerde helm opzetten en polsbanden aanbrengen om verder letsel te voorkomen. De dienstdoende hOvJ neemt de telefoon niet op. Wat mag de bewaarder?", "art": "Art. 35a lid 2 Ambtsinstructie", "o": [{"t": "Zelf beslissen, voor ten hoogste 3 uur, en de hOvJ onverwijld informeren", "u": "De hOvJ beslist daarna onverwijld over voortzetting. Ook de arts wordt onverwijld op de hoogte gesteld.", "c": true}, {"t": "Wachten tot de hOvJ toestemming heeft gegeven", "u": "Lid 2 geeft bij spoed een eigen bevoegdheid.", "c": false}, {"t": "Zelf beslissen en de maatregel ten hoogste 24 uur toepassen", "u": "24 uur is de termijn na toestemming van de hOvJ.", "c": false}, {"t": "Zelf beslissen; melden is dan niet meer nodig", "u": "De hOvJ moet onverwijld worden geïnformeerd.", "c": false}]}, {"v": "Welk middel staat op de limitatieve lijst van hulpmiddelen jegens ingeslotenen?", "art": "Art. 2 lid 5 Besluit bewapening en uitrusting politie", "o": [{"t": "Enkelbanden met tussenstuk", "u": "De lijst: gecapitonneerde helm, gecapitonneerde handschoenen, mondafscherming, polsbanden en enkelbanden met tussenstuk.", "c": true}, {"t": "Tie-wraps of boeitouwtjes", "u": "Dat zijn vrijheidsbeperkende middelen, maar ze staan niet op deze lijst.", "c": false}, {"t": "Stalen handboeien", "u": "Verblijf in de cel met handboeien is niet toegestaan; bij insluiting worden ze vervangen door polsbanden.", "c": false}, {"t": "Een dwangbuis", "u": "Staat niet op de lijst, en de lijst is limitatief.", "c": false}]}, {"v": "In het cellencomplex wil de arrestantenbewaarder polsbanden aanbrengen bij een ingeslotene die zichzelf dreigt te verwonden; de man verzet zich. Twee collega's van de noodhulp, die niet in deze hulpmiddelen zijn getraind, schieten te hulp en houden hem vast. Op welke grondslag handelen de noodhulpcollega's volgens de syllabus?", "art": "Art. 35a Ambtsinstructie (toelichting); art. 7 lid 1 en lid 7 Politiewet 2012", "o": [{"t": "Op art. 7 lid 1 en 7 Politiewet", "u": "Zij wenden geweld aan door te fixeren. Het toepassen van de hulpmiddelen zelf is voorbehouden aan de ambtenaar die <li>doel rechtvaardigt het geweld, mede gelet op de gevaren<\/li>\n<li>doel kan niet op andere wijze worden bereikt<\/li>\n<li>zo mogelijk vooraf waarschuwen<\/li>\n<li><strong>redelijk<\/strong> = subsidiair = het gekozen middel<\/li>\n<li><strong>gematigd<\/strong> = proportioneel = de gekozen hoeveelheid<\/li>\n<\/ul>\n<p>Bevoegd gezag: <strong>burgemeester<\/strong> (openbare orde, hulpverlening), <strong>officier van justitie<\/strong> (strafrecht).<\/p>\n<h2>Begrippen Ambtsinstructie<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Begrip<\/th>\n<th>Trefwoorden<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Geweld<\/td>\n<td>dwangmatige kracht · meer dan geringe betekenis · op personen of zaken<\/td>\n<\/tr>\n<tr>\n<td>Aanwenden van geweld<\/td>\n<td>gebruik van geweld of geweldmiddel · ook ter hand nemen vuurwapen<\/td>\n<\/tr>\n<tr>\n<td>Geweldmiddel<\/td>\n<td>toegelaten bewapening: pistool, wapenstok, pepperspray, stroomstootwapen, hond · <strong>niet<\/strong>: handboeien, schild<\/td>\n<\/tr>\n<tr>\n<td>Gebruik vuurwapen<\/td>\n<td>richten · gericht houden · schieten<\/td>\n<\/tr>\n<tr>\n<td>Art. 4<\/td>\n<td>middel rechtens toegekend · voor die taak · geoefend<\/td>\n<\/tr>\n<tr>\n<td>Art. 5<\/td>\n<td>onder leiding van aanwezige meerdere: alleen na uitdrukkelijke last<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Wanneer mag welk middel?<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Grond<\/th>\n<th>Vuurwapen<\/th>\n<th>Pepperspray<\/th>\n<th>SSW schiet<\/th>\n<th>SSW schok<\/th>\n<th>Wapenstok<\/th>\n<th>Hond<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Aanhouden gevaarlijke persoon<\/td>\n<td>vuurwapen of <strong>levensbedreigend<\/strong> geweld<\/td>\n<td>wapen of ander geweld<\/td>\n<td>wapen of ander geweld<\/td>\n<td>nee<\/td>\n<td>wapen of ander geweld<\/td>\n<td>vuurwapen of ander geweld<\/td>\n<\/tr>\n<tr>\n<td>Aanhouden na onttrekken<\/td>\n<td><strong>4 jaar<\/strong> + extra eis<\/td>\n<td>ja<\/td>\n<td>ja<\/td>\n<td>nee<\/td>\n ng<\/td>\n<td>n.v.t.<\/td>\n<\/tr>\n<tr>\n<td>Geweld of geweldmiddel, vuurwapen ter hand<\/td>\n<td><strong>schriftelijk<\/strong> (i8): aard, middel, gevolgen · <strong>mondeling<\/strong>: feiten, omstandigheden, redenen · zo spoedig mogelijk<\/td>\n<td>hOvJ<\/td>\n<\/tr>\n<tr>\n<td>Handboeien, mondafscherming<\/td>\n<td>onverwijld schriftelijk, met redenen<\/td>\n<td>hOvJ<\/td>\n<\/tr>\n<tr>\n<td>Veiligheidsfouillering<\/td>\n<td>onverwijld schriftelijk, met redenen<\/td>\n<td>hOvJ<\/td>\n<\/tr>\n<tr>\n<td>Vervoersfouillering<\/td>\n<td>geen melding<\/td>\n<td>n.v.t.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>hOvJ registreert bij:<\/strong> dood of letsel van meer dan geringe betekenis · vuurwapengebruik · eigen oordeel.\n<strong>Terstond naar de officier van justitie bij:<\/strong> dood of zwaar lichamelijk letsel · vuurwapengebruik met enig letsel.<\/p>\n<h2>Handboeien en mondafscherming<\/h2>\n<ul>\n<li>persoon is rechtens van zijn vrijheid beroofd · voor vervoer of verplaatsing<\/li>\n<li>feiten of omstandigheden: gevaar voor <strong>ontvluchting<\/strong> of voor de <strong>veiligheid<\/strong><\/li>\n<li>mondafscherming: alleen voor de veiligheid van ambtenaar of derden<\/li>\n<li>bij hulpverlening: alleen de veiligheidsgrond<\/li>\n<\/ul>\n<p><strong>Ezelsbruggetje GOED:<\/strong> <strong>G<\/strong>eweld · <strong>O<\/strong>ntvluchten · <strong>E<\/strong>erdere ervaring · <strong>D<\/strong>elict. Gebruik het om feiten en omstandigheden te vinden. De wet kent maar twee gronden: ontvluchting en veiligheid. Het delict of een eerdere ervaring is dus nooit op zichzelf genoeg.<\/p>\n<h2>Fouilleren<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Soort<\/th>\n<th>Kern<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Veiligheid<\/strong> (art. 7 lid 3 Politiewet)<\/td>\n<td>iedere persoon · kleding en meegevoerde voorwerpen · onmiddellijk gevaar uit feiten of omstandigheden · noodzakelijk · zo veel mogelijk zelfde geslacht · melden<\/td>\n<\/tr>\n<tr>\n<td><strong>Vervoer<\/strong> (art. 7 lid 4 Politiewet)<\/td>\n<td>te vervoeren of in te sluiten persoon · standaard vóór vervoer door de politie · niet melden<\/td>\n<\/tr>\n<tr>\n<td><strong>Insluiting<\/strong> (Ambtsinstructie)<\/td>\n<td>aftasten en doorzoeken van kleding en voorwerpen van de ingeslotene<\/td>\n<\/tr>\n<tr>\n<td><strong>Opsporing<\/strong> (art. 56 Sv, buiten de RTGP-toetseisen)<\/td>\n<td>aangehouden verdachte · ernstige bezwaren · belang van het onderzoek · aan het lichaam: officier van justitie of hOvJ · in het lichaam: officier van justitie, door een arts<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Afweerbevoegdheid<\/h2>\n<ul>\n<li>direct gevaar voor leven of zwaar lichamelijk letsel afwenden<\/li>\n<li>voor jezelf, voor derden en voor de veroorzaker zelf<\/li>\n<li>staat bij elk geweldmiddel: geen bevoegdheid op zich, maar onderdeel van de geweldsbevoegdheid<\/li>\n<li>daardoor minder vaak een beroep op strafuitsluitingsgronden nodig<\/li>\n<\/ul>\n<h2>Strafuitsluitingsgronden<\/h2>\n<p>Art. 39 ontoerekenbaarheid · art. 40 overmacht · art. 41 noodweer en noodweerexces · art. 42 wettelijk voorschrift (lid 2: geweld volgens de geweldsinstructie) · art. 43 ambtelijk bevel.<\/p>"};

  l3.appendChild(sb); main.appendChild(l3);

  main.appendChild($("details", { cls: "about" }, `<summary>Verantwoording en bronnen</summary><ul>
<li><b>Wettekst online:</b> <a href="https://wetten.overheid.nl/BWBR0006589" target="_blank" rel="noopener noreferrer">Ambtsinstructie</a>, <a href="https://wetten.overheid.nl/BWBR0031788" target="_blank" rel="noopener noreferrer">Politiewet 2012</a>, <a href="https://wetten.overheid.nl/BWBR0001854" target="_blank" rel="noopener noreferrer">Wetboek van Strafrecht</a>, <a href="https://wetten.overheid.nl/BWBR0001903" target="_blank" rel="noopener noreferrer">Wetboek van Strafvordering</a>. Onder elke vraag staat welk artikel de basis is, met een link naar de wettekst.</li>
<li><b>Bron:</b> Syllabus Geweldsbeheersing, actuele wetgeving met toelichting, versie 2.0 van 24 februari 2023 (G. Theloosen en J. van der Goot). De stof volgt de RTGP-toetseisen voor vuurwapendragenden uit bijlage 14.</li>
<li><b>Ook gebruikt:</b> de samenvatting Geweldsbeheersing (jjp, september 2022) en het lesdeck Ambtsinstructie &amp; Politiewet (J. Vermaat, mei 2023). Waar die afweken van de huidige wettekst, is de wettekst gevolgd. Praktijkpunten uit de les, zoals het i8-formulier, zijn als zodanig benoemd.</li>
<li><b>Wettekst gecontroleerd</b> op wetten.overheid.nl op 12 november 2026: de Ambtsinstructie in de versie die geldt sinds 1 januari 2026 en de Politiewet 2012 in de versie die geldt sinds 12 juni 2026. De artikelen in dit document komen daarmee overeen.</li>
<li><b>Toelichtingen, voorbeelden en rechtspraak</b> komen uit de syllabus en zijn niet afzonderlijk nageslagen. Waar dat speelt staat erbij: 'volgens de syllabus'.</li>
<li><b>Korpsvoorschriften</b>, zoals het vastleggen van dreigen met het stroomstootwapen (actie SSWD), geven de stand van de syllabus uit 2023 weer. Kijk voor de huidige werkwijze op intranet.</li>
<li>Art. 10 van de Ambtsinstructie spreekt in de wettekst van 'vuurwapen'; de syllabus zegt 'dienstpistool'. Bij art. 10 en 10a vermeldt wetten.overheid.nl een wijziging die nog niet in werking is getreden.</li>
<li>Dit zijn eigen oefenvragen, geen officiële examenvragen. Elke toets trekt 20 vragen uit een iets grotere voorraad; de vragen en de volgorde van de antwoorden wisselen per poging.</li></ul>`));
}


const BASE = "https://wetten.overheid.nl/";
const LAWS = [
  [/Ambtsinstructie/, "Ambtsinstructie", "BWBR0006589"],
  [/Politiewet/, "Politiewet 2012", "BWBR0031788"],
  [/Besluit bewapening/, "Besluit bewapening en uitrusting politie", "BWBR0032136"],
  [/\bSr\b/, "Sr", "BWBR0001854"],
  [/\bSv\b/, "Sv", "BWBR0001903"]
];
function srcHtml(art) {
  const out = [], seen = {};
  const add = (label, url) => { if (!seen[url]) { seen[url] = 1; out.push('<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + '</a>'); } };
  art.split(";").forEach(seg => {
    if (/EVRM/.test(seg)) { const m = seg.match(/[Aa]rt\.\s*(\d+)/); add("art. " + (m ? m[1] : "") + " EVRM", BASE + "BWBV0001000"); return; }
    const law = LAWS.find(l => l[0].test(seg));
    if (!law) return;
    const re = /[Aa]rt\.\s*(\d+[a-z]?)(?:\s+en\s+(\d+[a-z]?)(?![a-z]))?/g;
    let m;
    while ((m = re.exec(seg))) {
      [m[1], m[2]].filter(Boolean).forEach(n => add("art. " + n + " " + law[1], BASE + "jci1.3:c:" + law[2] + "&artikel=" + n));
    }
  });
  return "Bron: " + art + (out.length ? '<br>Lees de wettekst: ' + out.join(" &middot; ") : "");
}


const LM = { AI: ["BWBR0006589", "Ambtsinstructie"], PW: ["BWBR0031788", "Politiewet 2012"], BBUP: ["BWBR0032136", "Besluit bewapening en uitrusting politie"], SR: ["BWBR0001854", "Wetboek van Strafrecht"], SV: ["BWBR0001903", "Wetboek van Strafvordering"], EVRM: ["BWBV0001000", "EVRM"], GW: ["BWBR0001840", "Grondwet"] };
const REF2 = /\b[Aa]rt(?:ikel|\.)\s+(\d+[a-z]?)((?:\s+lid\s+\d+)?(?:\s+en\s+\d+[a-z]?)?(?:\s+sub\s+[a-z])?)(\s+(?:AI|Ambtsinstructie|Politiewet(?: 2012)?|Sr|Sv|EVRM|Bbup|Grondwet))?/g;
function lawOf2(num, rest, mark, theme) {
  if (mark) { const w = mark.trim(); return w === "AI" || w === "Ambtsinstructie" ? "AI" : w === "Sr" ? "SR" : w === "Sv" ? "SV" : w === "EVRM" ? "EVRM" : w === "Bbup" ? "BBUP" : w === "Grondwet" ? "GW" : "PW"; }
  if (["39", "40", "41", "42", "43", "372"].indexOf(num) > -1) return "SR";
  if (theme === "basis") return ["3", "7", "11", "12"].indexOf(num) > -1 ? "PW" : "AI";
  if (num === "7" && /lid\s+[34]\b/.test(rest)) return "PW";
  return "AI";
}
function linkNotes(root, theme) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nodes = []; let n;
  while ((n = w.nextNode())) { if (/[Aa]rt(?:ikel|\.)\s+\d/.test(n.nodeValue)) nodes.push(n); }
  nodes.forEach(t => {
    const h = escH(t.nodeValue).replace(REF2, (x, num, rest, mark) => {
      const law = lawOf2(num, rest || "", mark, theme), L = LM[law];
      const url = "https://wetten.overheid.nl/jci1.3:c:" + L[0] + (law === "EVRM" ? "" : "&artikel=" + num);
      return '<a class="wl" href="' + url + '" target="_blank" rel="noopener noreferrer" title="Wettekst: ' + L[1] + (law === "EVRM" ? "" : " art. " + num) + ' (wetten.overheid.nl)">' + x + '</a>';
    });
    const sp = document.createElement("span"); sp.innerHTML = h; t.parentNode.replaceChild(sp, t);
  });
}

function leerstof() {
  main.innerHTML = "";
  const sub = $("div", { cls: "sub" });
  T.forEach((t, i) => { const b = $("button", { on: () => { S.theme = i; render(); } }, (i + 1) + ". " + t.title); b.setAttribute("aria-current", i === S.theme ? "true" : "false"); sub.appendChild(b); });
  main.appendChild(sub);
  const t = T[S.theme];
  const c = $("article", { cls: "card notes" }, "<h1>" + t.title + "</h1><p class='lead'>" + t.sub + "</p>" + t.notes);
  main.appendChild(c); linkNotes(c, t.key);
  const r = $("div", { cls: "row" });
  r.appendChild($("button", { cls: "btn", on: () => start(S.theme) }, "Maak toets " + (S.theme + 1)));
  main.appendChild(r);
}

function samenvatting() {
  main.innerHTML = "";
  const sa = $("article", { cls: "card notes" }, "<h1>Samenvatting</h1><p class='lead'>Alles in trefwoorden, om vlak voor de toets door te lopen. De uitleg staat onder Leerstof.</p>" + D.summary);
  main.appendChild(sa); linkNotes(sa, "sum");
}

function start(i) {
  let qs, id, title;
  if (i < 0) { qs = []; T.forEach(t => shuffle(t.quiz).slice(0, 5).forEach(q => qs.push(q))); qs = shuffle(qs); id = "mix"; title = "Eindtoets"; }
  else { qs = shuffle(T[i].quiz).slice(0, 20); id = T[i].key; title = "Toets " + (i + 1) + ": " + T[i].title; }
  Z = { id, title, theme: i, qs: qs.map(q => ({ q, opts: shuffle(q.o), pick: null })), at: 0 };
  S.view = "quiz"; render();
}

function quiz() {
  main.innerHTML = "";
  const n = Z.qs.length, it = Z.qs[Z.at], q = it.q, done = it.pick != null;
  const good = Z.qs.filter(x => x.pick != null && x.opts[x.pick].c).length;
  const c = $("div", { cls: "card" });
  c.appendChild($("div", { cls: "bar" }, "<span>" + Z.title + "</span><span>Vraag " + (Z.at + 1) + " van " + n + " · " + good + " goed</span>"));
  c.appendChild($("div", { cls: "prog" }, "<i style='width:" + ((Z.at + (done ? 1 : 0)) / n * 100) + "%'></i>"));
  c.appendChild($("p", { cls: "q" }, q.v));
  it.opts.forEach((o, k) => {
    const b = $("button", { cls: "opt" + (done ? (o.c ? " ok" : (k === it.pick ? " no" : "")) : ""), on: () => { if (it.pick == null) { it.pick = k; quiz(); } } });
    b.appendChild($("span", { cls: "l" }, "ABCD"[k]));
    b.appendChild($("span", null, o.t));
    if (done) b.disabled = true;
    c.appendChild(b);
  });
  if (done) {
    const p = it.opts[it.pick], ci = it.opts.findIndex(o => o.c), cor = it.opts[ci];
    const f = $("div", { cls: "fb " + (p.c ? "ok" : "no") });
    if (p.c) f.innerHTML = "<b class='h'>Goed</b><p>" + cor.u + "</p>";
    else f.innerHTML = "<b class='h'>Niet goed</b><p><span class='lab'>Jouw antwoord (" + "ABCD"[it.pick] + "):</span> " + p.u + "</p><p><span class='lab'>Juist is " + "ABCD"[ci] + ":</span> " + cor.u + "</p>";
    const rest = it.opts.map((o, k) => [o, k]).filter(([o, k]) => !o.c && k !== it.pick);
    f.appendChild($("details", { cls: "more" }, "<summary>Waarom de andere antwoorden niet kloppen</summary>" + rest.map(([o, k]) => "<p><span class='lab'>" + "ABCD"[k] + ":</span> " + o.u + "</p>").join("")));
    f.appendChild($("div", { cls: "src" }, srcHtml(q.art)));
    c.appendChild(f);
    const r = $("div", { cls: "row" });
    r.appendChild($("button", { cls: "btn", on: () => { if (Z.at < n - 1) { Z.at++; quiz(); window.scrollTo(0, 0); } else { S.view = "result"; render(); } } }, Z.at < n - 1 ? "Volgende vraag" : "Bekijk resultaat"));
    c.appendChild(r);
  }
  main.appendChild(c);
  const r2 = $("div", { cls: "row" });
  r2.appendChild($("button", { cls: "btn ghost", on: () => { S.view = "toetsen"; render(); } }, "Stoppen"));
  main.appendChild(r2);
}

function result() {
  main.innerHTML = "";
  const n = Z.qs.length, good = Z.qs.filter(x => x.opts[x.pick].c).length, pct = Math.round(good / n * 100);
  if (best[Z.id] == null || good > best[Z.id]) { best[Z.id] = good; saveBest(); }
  const c = $("div", { cls: "card" });
  const cls = pct >= 85 ? "a" : pct >= 65 ? "b" : "c", lab = pct >= 85 ? "Ruim voldoende" : pct >= 65 ? "Bijna: herhaal de fouten" : "Nog onvoldoende: lees de leerstof";
  c.appendChild($("div", { cls: "res" }, "<span class='badge " + cls + "'>" + lab + "</span><div class='big'>" + good + " / " + n + "</div><div class='pct'>" + pct + "% goed · " + Z.title + "</div>"));
  const r = $("div", { cls: "row", style: "justify-content:center" });
  r.appendChild($("button", { cls: "btn", on: () => start(Z.theme) }, "Opnieuw"));
  if (Z.theme >= 0) r.appendChild($("button", { cls: "btn ghost", on: () => { S.view = "leerstof"; S.theme = Z.theme; render(); } }, "Leerstof"));
  r.appendChild($("button", { cls: "btn ghost", on: () => { S.view = "toetsen"; render(); } }, "Alle toetsen"));
  c.appendChild(r);
  const miss = Z.qs.filter(x => !x.opts[x.pick].c);
  if (miss.length) {
    const rv = $("div", { cls: "rev" }, "<h3>Fout beantwoord (" + miss.length + ")</h3>");
    miss.forEach(x => { const cor = x.opts.find(o => o.c); rv.appendChild($("div", { cls: "rv" }, "<b>" + x.q.v + "</b><div class='a'>Jouw antwoord: " + x.opts[x.pick].t + "</div><div><span style='font-weight:700'>Juist:</span> " + cor.t + ". " + cor.u + "</div><div class='src'>" + srcHtml(x.q.art) + "</div>")); });
    c.appendChild(rv);
  }
  main.appendChild(c);
}

let IDX = null, ZQ = "";
function escH(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function hlH(t, terms) { let o = escH(t); terms.forEach(w => { o = o.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); }); return o; }
function buildIdx() {
  IDX = [];
  T.forEach((t, ti) => {
    const d = document.createElement("div"); d.innerHTML = t.notes;
    d.querySelectorAll("p,li,tr,h2,h3").forEach(e => { if ((e.tagName === "P" || e.tagName === "LI") && e.querySelector("p,li,tr")) return; const x = (e.textContent || "").replace(/\s+/g, " ").trim(); if (x.length > 2) IDX.push({ ti: ti, sec: "Leerstof · " + t.title, t: x }); });
    t.quiz.forEach(q => { const c = q.o.find(o => o.c); IDX.push({ ti: ti, sec: "Vraag · " + t.title, t: q.v, a: c.t, u: c.u, art: q.art }); });
  });
  const s = document.createElement("div"); s.innerHTML = D.summary;
  s.querySelectorAll("p,li,tr,h2").forEach(e => { if ((e.tagName === "P" || e.tagName === "LI") && e.querySelector("p,li,tr")) return; const x = (e.textContent || "").replace(/\s+/g, " ").trim(); if (x.length > 2) IDX.push({ ti: -1, sec: "Samenvatting", t: x }); });
}
function zoek() {
  main.innerHTML = "";
  if (!IDX) buildIdx();
  const inp = $("input", { cls: "zq", type: "search", placeholder: "Zoek, bijv. 24 uur, boeien, hond", "aria-label": "Zoeken", autocomplete: "off" });
  inp.value = ZQ;
  const out = $("div");
  main.appendChild(inp); main.appendChild(out);
  const run = () => {
    ZQ = inp.value; out.innerHTML = "";
    const terms = ZQ.toLowerCase().split(/\s+/).filter(w => w.length > 0);
    if (!terms.length) { out.appendChild($("p", { cls: "sub" }, "Zoekt in de leerstof, de samenvatting en alle toetsvragen.")); return; }
    const hits = IDX.filter(e => { const h = (e.sec + " " + e.t + " " + (e.a || "") + " " + (e.u || "")).toLowerCase(); return terms.every(w => h.indexOf(w) > -1); });
    out.appendChild($("p", { cls: "sub" }, hits.length + " resultaten"));
    hits.slice(0, 40).forEach(e => {
      const b = $("button", { cls: "zr", on: () => { if (e.ti >= 0) { S.view = "leerstof"; S.theme = e.ti; } else { S.view = "samenvatting"; } render(); } });
      b.innerHTML = "<span class='z1'>" + escH(e.sec) + "</span><span class='z2'>" + hlH(e.t, terms) + "</span>" + (e.a ? "<span class='z3'>Antwoord: " + hlH(e.a, terms) + "</span><span class='z4'>" + hlH(e.u, terms) + "</span>" : "");
      out.appendChild(b);
    });
  };
  inp.addEventListener("input", run);
  run();
}
function render() { nav(); ({ toetsen: home, leerstof: leerstof, samenvatting: samenvatting, zoek: zoek, quiz: quiz, result: result })[S.view](); if (S.view !== "zoek") window.scrollTo(0, 0); }
const up = $("button", { id: "up", "aria-label": "Naar boven", on: () => window.scrollTo({ top: 0, behavior: "smooth" }) }, "&#8593;");
document.body.appendChild(up);
window.addEventListener("scroll", () => { up.style.display = window.scrollY > 300 ? "block" : "none"; }, { passive: true });
render();
</script>

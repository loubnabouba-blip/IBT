<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<title>Geweldsbeheersing — Leerdoc &amp; Oefentoetsen</title>
<style>
:root{--ink:#16202e;--muted:#5a6779;--line:#dde3ec;--bg:#f3f5f9;--card:#fff;--navy:#10294a;--blue:#1f5fd0;--blue-d:#174aa6;--blue-l:#e9f0fd;--ok:#12703a;--ok-l:#e2f5e9;--no:#a8231f;--no-l:#fbe7e6;--amber:#7a5200;--amber-l:#fdf3d7}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit}
.top{background:var(--navy);color:#fff;padding:18px 16px 14px}
.top .in,.wrap{max-width:820px;margin:0 auto}
.top h1{margin:0;font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
.top p{margin:4px 0 0;font-size:.85rem;opacity:.8}
.nav{position:sticky;top:0;z-index:5;background:var(--navy);padding:0 16px 10px}
.nav .in{max-width:820px;margin:0 auto;display:flex;gap:6px}
.nav button{flex:1;min-width:0;border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;padding:8px 6px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer}
.nav button[aria-current="true"]{background:#fff;color:var(--navy);border-color:#fff}
.wrap{padding:18px 16px 56px}
h2.sec{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:700}
h2.sec:first-child{margin-top:4px}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px;cursor:pointer}
.item:hover,.item:focus-visible{border-color:var(--blue);outline:none}
.item .n{flex:none;width:34px;height:34px;border-radius:9px;background:var(--blue-l);color:var(--blue-d);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.item.mix .n{background:var(--navy);color:#fff}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:1rem;line-height:1.3}
.item .tx span{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}
.item .sc{flex:none;font-size:.78rem;font-weight:700;color:var(--muted);text-align:right;white-space:nowrap}
.item .sc.done{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px}
.lead{font-size:.92rem;color:var(--muted);margin:0 0 14px}
details.about{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.88rem}
details.about summary{cursor:pointer;font-weight:700}
details.about ul{margin:10px 0 2px;padding-left:18px}
details.about li{margin-bottom:6px}
.sub{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 4px;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:.84rem;font-weight:600;cursor:pointer;white-space:nowrap}
.sub button[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.notes h1{font-size:1.25rem;margin:0 0 4px;line-height:1.25}
.notes h2{font-size:1.08rem;margin:26px 0 8px;padding-top:14px;border-top:1px solid var(--line);color:var(--navy)}
.notes h2:first-of-type{border-top:0;padding-top:0;margin-top:14px}
.notes h3{font-size:.98rem;margin:20px 0 6px;color:var(--navy)}
.notes p{margin:8px 0}
.notes ul,.notes ol{margin:8px 0;padding-left:20px}
.notes li{margin-bottom:5px}
.notes strong{color:var(--navy)}
.tw{overflow-x:auto;margin:12px -16px;padding:0 16px}
.notes table{border-collapse:collapse;font-size:.86rem;min-width:100%}
.notes th,.notes td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;min-width:110px}
.notes th{background:#eef2f8;font-weight:700}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:8px}
.prog{height:6px;background:#e3e8f0;border-radius:99px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--blue);transition:width .2s}
.q{font-size:1.05rem;font-weight:650;line-height:1.45;margin:0 0 14px;color:var(--navy)}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 12px;margin-bottom:9px;cursor:pointer;font-size:.96rem;line-height:1.4}
.opt .l{flex:none;width:24px;height:24px;border-radius:6px;background:#eef2f8;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt:not(:disabled):hover{border-color:var(--blue)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-l)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--no-l)}
.opt.no .l{background:var(--no);color:#fff}
.fb{border-radius:10px;padding:12px 14px;margin-top:6px;font-size:.92rem}
.fb.ok{background:var(--ok-l)}
.fb.no{background:var(--no-l)}
.fb b.h{display:block;margin-bottom:4px}
.fb.ok b.h{color:var(--ok)}
.fb.no b.h{color:var(--no)}
.fb p{margin:6px 0 0}
.fb .lab{font-weight:700}
.src{font-size:.8rem;color:var(--muted);margin-top:10px}
details.more{margin-top:10px;font-size:.88rem}
details.more summary{cursor:pointer;color:var(--blue-d);font-weight:600}
details.more p{margin:8px 0 0}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.btn{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:11px 18px;font-weight:650;font-size:.94rem;cursor:pointer}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:transparent;color:var(--blue-d);border:1.5px solid var(--blue)}
.res{text-align:center;padding:8px 0 4px}
.res .big{font-size:2.6rem;font-weight:800;color:var(--navy);line-height:1.1}
.res .pct{color:var(--muted);font-size:.92rem;margin-top:2px}
.badge{display:inline-block;border-radius:99px;padding:5px 14px;font-size:.84rem;font-weight:700;margin-bottom:10px}
.badge.a{background:var(--ok-l);color:var(--ok)}.badge.b{background:var(--amber-l);color:var(--amber)}.badge.c{background:var(--no-l);color:var(--no)}
.rev{margin-top:18px}
.rev h3{font-size:.95rem;margin:0 0 8px}
.rv{border:1px solid var(--line);border-left:4px solid var(--no);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:.9rem}
.rv b{display:block;margin-bottom:4px}
.rv .a{color:var(--muted);font-size:.84rem}
.nav button{font-size:.84rem!important}
.zq{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink,#14213d);font:16px system-ui;margin-bottom:10px}
.zr{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.zr .z1{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--blue-d)}
.zr .z2{display:block;margin-top:2px}
.zr .z3{display:block;margin-top:4px;color:var(--ok);font-size:.88rem}
.zr .z4{display:block;margin-top:2px;color:var(--muted);font-size:.82rem}
a.wl{color:var(--blue-d);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
mark{background:#fff0b3;color:inherit;border-radius:3px;padding:0 1px}
#up{position:fixed;right:14px;bottom:18px;width:46px;height:46px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:1.4rem;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:pointer;display:none;z-index:9}
</style>
</head>

<script>
const D = {"themes": [{"key": "basis", "title": "Grondslagen", "sub": "Politiewet art. 3 en 7, begrippen, EVRM", "notes": "<h2>In één oogopslag<\/h2>\n<ul>\n<li>Geweld is <strong>ultimum remedium<\/strong>: alleen als het doel niet op een andere, minder ingrijpende manier bereikt kan worden.<\/li>\n<li>De grondslag is altijd <strong>art. 7 Politiewet 2012<\/strong>. De Ambtsinstructie (AI) werkt die bevoegdheid uit per geweldmiddel.<\/li>\n<li>Vier toetsstenen die bij elke vraag terugkomen: <strong>proportionaliteit<\/strong>, <strong>subsidiariteit<\/strong>, <strong>redelijkheid<\/strong> en <strong>gematigdheid<\/strong>.<\/li>\n<\/ul>\n<h2>Geweldsmonopolie en grondrechten<\/h2>\n<p>De overheid heeft het geweldsmonopolie en heeft de uitoefening bij wet opgedragen aan de politie. Het Openbaar Ministerie onderzoekt de toepassing, de rechter oordeelt.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Bepaling<\/th>\n<th>Kern<\/th>\n<th>Absoluut?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Art. 2 EVRM<\/td>\n<td>Recht op leven. Doden is alleen niet in strijd met het verdrag als het geweld <strong>absoluut noodzakelijk<\/strong> was: (a) verdediging tegen onrechtmatig geweld, (b) rechtmatige arrestatie of voorkomen van ontsnapping, (c) onderdrukken van oproer of opstand<\/td>\n<td>Nee<\/td>\n<\/tr>\n<tr>\n<td>Art. 3 EVRM<\/td>\n<td>Verbod van foltering en onmenselijke of vernederende behandeling<\/td>\n<td><strong>Ja<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Art. 5 EVRM<\/td>\n<td>Recht op vrijheid: vrijheidsbeneming alleen met wettelijke grondslag<\/td>\n<td>Nee<\/td>\n<\/tr>\n<tr>\n<td>Art. 11 Grondwet<\/td>\n<td>Onaantastbaarheid van het lichaam: geweld, boeien en fouilleren zijn inbreuken die een wettelijke basis nodig hebben<\/td>\n<td>Nee<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Politiewet 2012<\/h2>\n<p><strong>Art. 3 – politietaak.<\/strong> In ondergeschiktheid aan het bevoegd gezag en in overeenstemming met de geldende rechtsregels zorgen voor (1) de daadwerkelijke handhaving van de rechtsorde en (2) hulp aan hen die deze behoeven.<\/p>\n<p><strong>Art. 11 en 12 – gezag.<\/strong> Openbare orde en hulpverlening: de <strong>burgemeester<\/strong>. Strafrechtelijke handhaving: de <strong>officier van justitie<\/strong>.<\/p>\n<h3>Art. 7 lid 1 – de geweldsbevoegdheid<\/h3>\n<p>De ambtenaar mag geweld of vrijheidsbeperkende middelen gebruiken als aan alle voorwaarden is voldaan:<\/p>\n<ol>\n<li>hij handelt in de <strong>rechtmatige uitoefening van zijn bediening<\/strong> (geen bevoegdheid voor de handeling zelf = ook geen geweld);<\/li>\n<li>het beoogde doel <strong>rechtvaardigt<\/strong> het geweld, mede gelet op de gevaren ervan (<strong>proportionaliteit<\/strong>);<\/li>\n<li>het doel kan <strong>niet op een andere wijze<\/strong> worden bereikt (<strong>subsidiariteit<\/strong>);<\/li>\n<li><strong>zo mogelijk<\/strong> gaat een waarschuwing vooraf (algemene waarschuwingsplicht).<\/li>\n<\/ol>\n<h3>Art. 7 lid 7 – redelijk en gematigd<\/h3>\n<p>Geldt tijdens de uitoefening van alle bevoegdheden van lid 1 tot en met 6.<\/p>\n<ul>\n<li><strong>Redelijk<\/strong> (in de les: <strong>subsidiariteit<\/strong>): evenredigheid tussen het belang en het <strong>gekozen middel<\/strong>. Kun je het met je handen af, dan pak je geen geweldmiddel.<\/li>\n<li><strong>Gematigd<\/strong> (in de les: <strong>proportionaliteit<\/strong>): evenredigheid tussen het belang en de <strong>gekozen hoeveelheid<\/strong> geweld. Is één klap genoeg, dan geef je er geen twee.<\/li>\n<li><strong>Dubbele borging<\/strong>: proportionaliteit en subsidiariteit staan in lid 1 (mag ik geweld gebruiken?) en keren in lid 7 terug (hoe gebruik ik het?).<\/li>\n<\/ul>\n<h3>Art. 7 lid 3 – veiligheidsfouillering<\/h3>\n<p>Onderzoek aan de kleding en van voorwerpen die iemand bij zich draagt of meevoert, als:<\/p>\n<ul>\n<li>je een wettelijke bevoegdheid uitoefent of een handeling ter uitvoering van de politietaak verricht;<\/li>\n<li>uit <strong>feiten of omstandigheden<\/strong> blijkt dat een <strong>onmiddellijk gevaar<\/strong> dreigt voor het leven of de veiligheid van de persoon, van jou of van derden;<\/li>\n<li>het onderzoek <strong>noodzakelijk<\/strong> is om dat gevaar af te wenden.<\/li>\n<\/ul>\n<p>De persoon hoeft geen verdachte te zijn. Volgens de syllabus ging de parlementaire behandeling over tassen en rugzakken, niet over voertuigen; kan iemand niet meer bij zijn voertuig, dan is het gevaar niet meer onmiddellijk.<\/p>\n<h3>Art. 7 lid 4 – vervoersfouillering<\/h3>\n<p>Onderzoek aan de kleding en van meegevoerde voorwerpen van een <strong>te vervoeren of in te sluiten<\/strong> persoon, op voorwerpen die een gevaar voor de veiligheid kunnen vormen. Vóór het vervoer, bij iedere persoon die door de politie wordt vervoerd. Er is geen concreet gevaar nodig.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Veiligheidsfouillering (lid 3)<\/th>\n<th>Vervoersfouillering (lid 4)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Drempel<\/td>\n<td>Onmiddellijk gevaar uit feiten of omstandigheden<\/td>\n<td>Geen: standaardbevoegdheid vóór vervoer of insluiting<\/td>\n<\/tr>\n<tr>\n<td>Wie<\/td>\n<td>Iedere persoon<\/td>\n<td>Te vervoeren of in te sluiten persoon<\/td>\n<\/tr>\n<tr>\n<td>Melden<\/td>\n<td><strong>Ja<\/strong>, onverwijld schriftelijk aan de hOvJ (art. 21 AI)<\/td>\n<td><strong>Nee<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Ambtsinstructie: begrippen (art. 1)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Begrip<\/th>\n<th>Definitie<\/th>\n<th>Valkuil<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Geweld<\/strong> (lid 4 sub b)<\/td>\n<td>Elke dwangmatige kracht van meer dan geringe betekenis, uitgeoefend op personen of zaken<\/td>\n<td>Boeien zonder fysieke weerstand is geen geweld. Een ruit inslaan wel<\/td>\n<\/tr>\n<tr>\n<td><strong>Aanwenden van geweld<\/strong> (sub c)<\/td>\n<td>Het gebruiken van geweld, waaronder het gebruik van een geweldmiddel. Voor de melding van art. 17 telt ook het <strong>ter hand nemen van het vuurwapen<\/strong><\/td>\n<td>Dreigen is waarschuwen, geen aanwenden<\/td>\n<\/tr>\n<tr>\n<td><strong>Geweldmiddel<\/strong> (sub d)<\/td>\n<td>De toegelaten bewapening<\/td>\n<td>Handboeien, schild, zaklamp, dienstauto zijn geen geweldmiddel. Geweld daarmee valt onder art. 7 lid 1 en 7 Politiewet<\/td>\n<\/tr>\n<tr>\n<td><strong>Gebruik van een vuurwapen<\/strong> (sub j)<\/td>\n<td>Het <strong>richten, gericht houden of schieten<\/strong><\/td>\n<td>Richten zonder schieten is al gebruik<\/td>\n<\/tr>\n<tr>\n<td><strong>Vervoer<\/strong><\/td>\n<td>Overbrengen van een persoon van A naar B<\/td>\n<td>Handboeien en mondafscherming (art. 22 en 22a) alleen voor vervoer of verplaatsing, niet voor verblijf in de cel<\/td>\n<\/tr>\n<tr>\n<td><strong>Verplaatsing<\/strong> (sub q)<\/td>\n<td>Overbrengen van een persoon binnen dezelfde locatie, zonder vervoermiddel. De periode direct voor het vervoer of de verplaatsing valt eronder<\/td>\n<td>Van bureau naar bureau is vervoer<\/td>\n<\/tr>\n<tr>\n<td><strong>Wapenstok<\/strong> (lid 6)<\/td>\n<td>De korte en de lange wapenstok<\/td>\n<td>Niet de elektrische wapenstok (art. 16)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Art. 4 – wie mag een middel gebruiken?<\/strong> Alleen de ambtenaar (a) aan wie het middel <strong>rechtens is toegekend<\/strong>, voor de taak waarvoor het is toegekend, en (b) die in het gebruik ervan is <strong>geoefend<\/strong>. Beide eisen gelden samen.<\/p>\n<p><strong>Art. 5 – optreden onder leiding.<\/strong> Onder leiding van een ter plaatse aanwezige meerdere: geen geweld dan na diens <strong>uitdrukkelijke last<\/strong>, tenzij de meerdere vooraf anders heeft bepaald.<\/p>\n<h2>Veelgemaakte fouten<\/h2>\n<ol>\n<li>Art. 2 EVRM absoluut noemen. Alleen art. 3 EVRM is absoluut.<\/li>\n<li>Proportionaliteit en subsidiariteit door elkaar halen. Subsidiair (redelijk): kon het met een lichter middel? Proportioneel (gematigd): staat de hoeveelheid geweld in verhouding tot het doel?<\/li>\n<li>Denken dat dreigen met geweld een geweldsmelding vereist.<\/li>\n<li>Handboeien een geweldmiddel noemen.<\/li>\n<li>Denken dat de vervoersfouillering gemeld moet worden.<\/li>\n<\/ol>", "quiz": [{"v": "Welk artikel van het EVRM kent geen enkele uitzondering?", "art": "Art. 3 EVRM", "o": [{"t": "Art. 3: het verbod van foltering", "u": "Art. 3 EVRM is een absoluut verbod. Geweld dat een wettelijke grondslag heeft, tot het noodzakelijke beperkt blijft en wordt verantwoord, valt er niet onder.", "c": true}, {"t": "Art. 2: het recht op leven", "u": "Art. 2 is niet absoluut. Lid 2 noemt drie situaties waarin dodelijk geweld het verdrag niet schendt, mits het absoluut noodzakelijk was.", "c": false}, {"t": "Art. 5: het recht op vrijheid en veiligheid", "u": "Art. 5 laat vrijheidsbeneming toe als daarvoor een wettelijke grondslag bestaat, zoals bij een rechtmatige aanhouding.", "c": false}, {"t": "Art. 6: het recht op een eerlijk proces", "u": "Art. 6 gaat over de procedure voor de rechter en bevat geen geweldsverbod.", "c": false}]}, {"v": "De meldkamer meldt een man die op een drukke winkelstraat met een bijl op voorbijgangers inhakt. Je bent als eerste ter plaatse en ziet hoe hij een vrouw die al op de grond ligt opnieuw wil raken. Roepen en waarschuwen helpt niet; je schiet en de man overlijdt. Welke maatstaf legt art. 2 EVRM aan dit geweld?", "art": "Art. 2 lid 2 EVRM", "o": [{"t": "Het geweld moet absoluut noodzakelijk zijn geweest", "u": "Art. 2 lid 2 staat dodelijk geweld alleen toe als het absoluut noodzakelijk was voor een van drie doelen: verdediging tegen onrechtmatig geweld (zoals hier), een rechtmatige arrestatie of het voorkomen van ontsnapping, of het onderdrukken van oproer.", "c": true}, {"t": "Het geweld moet redelijk zijn geweest gelet op de openbare orde", "u": "Redelijkheid is te licht: het verdrag eist absolute noodzaak. Openbare orde als zodanig is geen van de drie doelen.", "c": false}, {"t": "Het geweld moet vooraf door de officier van justitie zijn goedgekeurd", "u": "Het verdrag kent geen toestemmingseis vooraf. De toets vindt achteraf plaats.", "c": false}, {"t": "Het geweld is nooit toegestaan, omdat het recht op leven absoluut is", "u": "Het recht op leven is niet absoluut; alleen art. 3 EVRM is dat.", "c": false}]}, {"v": "Welke omschrijving geeft de politietaak van art. 3 Politiewet 2012 juist weer?", "art": "Art. 3 Politiewet 2012", "o": [{"t": "De daadwerkelijke handhaving van de rechtsorde en het verlenen van hulp aan hen die deze behoeven", "u": "Dat zijn de twee onderdelen van de taak, uit te voeren in ondergeschiktheid aan het bevoegd gezag en in overeenstemming met de geldende rechtsregels.", "c": true}, {"t": "Het opsporen van strafbare feiten en het handhaven van de openbare orde", "u": "Opsporing en openbare orde zijn onderdelen van de handhaving van de rechtsorde. De hulpverleningstaak ontbreekt hier.", "c": false}, {"t": "Het handhaven van de rechtsorde en het uitvoeren van opdrachten van de burgemeester", "u": "De burgemeester is bevoegd gezag voor openbare orde en hulpverlening, maar zijn opdrachten zijn geen onderdeel van de taakomschrijving.", "c": false}, {"t": "Het beschermen van personen en goederen en het bestraffen van overtreders", "u": "Bestraffen is voorbehouden aan de rechter en, bij strafbeschikkingen, het Openbaar Ministerie.", "c": false}]}, {"v": "Op zaterdagavond zie je jongeren een fiets omgooien en vernielen (baldadigheid, een overtreding); ze verdwijnen voordat je bij ze bent. De volgende dag kom je tijdens je dienst een van hen toevallig tegen in de winkelstraat. Je zegt dat je hem wilt aanhouden voor gisteren, hij weigert en loopt door. Je werkt hem naar de grond. Is dat geweld gedekt door art. 7 lid 1 Politiewet?", "art": "Art. 7 lid 1 Politiewet 2012", "o": [{"t": "Nee: je was niet bevoegd tot deze aanhouding", "u": "Buiten heterdaad mag voor deze overtreding niet worden aangehouden. Je handelde dus niet in de rechtmatige uitoefening van je bediening, en dan is er ook geen geweldsbevoegdheid. De syllabus gebruikt dit voorbeeld.", "c": true}, {"t": "Ja: art. 7 lid 1 geeft een zelfstandige bevoegdheid om weerstand te breken", "u": "De geweldsbevoegdheid is gekoppeld aan een rechtmatige taakuitoefening en staat niet op zichzelf.", "c": false}, {"t": "Ja, mits je het geweld daarna zo spoedig mogelijk aan de hOvJ meldt", "u": "Melden is verplicht, maar maakt onrechtmatig optreden niet rechtmatig.", "c": false}, {"t": "Ja, zolang het geweld redelijk en gematigd is gebleven", "u": "Redelijkheid en gematigdheid komen pas aan de orde als de bevoegdheid er is.", "c": false}]}, {"v": "Art. 7 lid 1 Politiewet eist dat het doel 'niet op een andere wijze kan worden bereikt'. Welk beginsel is dat?", "art": "Art. 7 lid 1 Politiewet 2012", "o": [{"t": "Subsidiariteit", "u": "Subsidiariteit vraagt of het doel ook zonder geweld of met een lichter middel bereikt kan worden. In de les hoort hierbij het woord 'redelijk' uit lid 7: de keuze van het middel.", "c": true}, {"t": "Proportionaliteit", "u": "Proportionaliteit zit in de eis dat het doel het geweld, mede gelet op de gevaren, rechtvaardigt. In de les hoort hierbij het woord 'gematigd': de hoeveelheid geweld.", "c": false}, {"t": "Gematigdheid", "u": "Gematigdheid staat in lid 7 en ziet op de hoeveelheid geweld tijdens de uitoefening.", "c": false}, {"t": "Rechtmatigheid", "u": "Rechtmatigheid ziet op de vraag of je bevoegd was tot de handeling waarvoor je geweld gebruikte.", "c": false}]}, {"v": "Na een melding van een vechtpartij voor een café houd je met je collega een verdachte aan. Hij rukt zich los. Eén armklem zou volstaan om hem weer onder controle te krijgen, maar je collega trekt zijn wapenstok en slaat hem tweemaal. Welke eisen van art. 7 lid 7 Politiewet zijn geschonden?", "art": "Art. 7 lid 7 Politiewet 2012", "o": [{"t": "Redelijkheid (verkeerd middel) en gematigdheid (te veel geweld)", "u": "Redelijk ziet op de keuze van het middel (in de les: subsidiariteit): met de handen kon het. Gematigd ziet op de hoeveelheid geweld (in de les: proportionaliteit): meer dan nodig.", "c": true}, {"t": "Alleen gematigdheid, want de wapenstok is een toegelaten geweldmiddel", "u": "Dat een middel is toegelaten, zegt niet dat het in deze situatie het passende middel was. Ook de keuze van het middel wordt getoetst.", "c": false}, {"t": "Alleen de waarschuwingsplicht, want daarover gaat lid 7", "u": "De waarschuwingsplicht staat in lid 1 en in art. 12f van de Ambtsinstructie, niet in lid 7.", "c": false}, {"t": "Geen, want lid 7 geldt alleen voor fouilleringen", "u": "Lid 7 geldt voor alle bevoegdheden van lid 1 tot en met 6, dus ook voor geweld.", "c": false}]}, {"v": "Waarom spreekt men bij art. 7 Politiewet van een 'dubbele borging' van proportionaliteit en subsidiariteit?", "art": "Art. 7 lid 1 en lid 7 Politiewet 2012", "o": [{"t": "Omdat lid 1 de beslissing normeert en lid 7 de uitvoering", "u": "Lid 1: rechtvaardigt het doel het geweld en kan het niet anders? Lid 7: het geweld zelf moet redelijk en gematigd blijven.", "c": true}, {"t": "Omdat zowel de Politiewet als het Wetboek van Strafrecht de eisen stelt", "u": "De term slaat op de twee leden van art. 7 zelf.", "c": false}, {"t": "Omdat eerst de hOvJ en daarna de officier van justitie het geweld beoordeelt", "u": "Dat is de beoordeling achteraf, niet de wettelijke verankering van de beginselen.", "c": false}, {"t": "Omdat voor geweld altijd twee waarschuwingen nodig zijn", "u": "De wet schrijft geen tweede waarschuwing voor.", "c": false}]}, {"v": "De meldkamer stuurt je naar een winkeldiefstal. De beveiliger houdt de dief vast tot je er bent. Je houdt hem aan en wilt hem naar het bureau vervoeren. Hij is rustig, steekt zelf zijn polsen uit en werkt mee. Je legt hem handboeien aan. Is dit 'geweld' in de zin van de Ambtsinstructie?", "art": "Art. 1 lid 4 sub b Ambtsinstructie", "o": [{"t": "Nee: zonder weerstand is boeien geen geweld", "u": "Geweld is dwangmatige kracht van meer dan geringe betekenis. Volgens de toelichting valt boeien zonder uitdrukkelijke fysieke weerstand daar niet onder. Het gebruik van de boeien meld je wel op grond van art. 23.", "c": true}, {"t": "Ja: handboeien zijn een geweldmiddel", "u": "Handboeien zijn een vrijheidsbeperkend middel en geen geweldmiddel.", "c": false}, {"t": "Ja: elke inbreuk op de bewegingsvrijheid is geweld", "u": "Het begrip geweld vraagt dwangmatige kracht van meer dan geringe betekenis. Een vrijheidsbeperking is niet per definitie geweld.", "c": false}, {"t": "Nee, en er hoeft ook niets te worden gemeld", "u": "Het is geen geweld, maar het gebruik van handboeien moet onverwijld schriftelijk aan de hOvJ worden gemeld (art. 23).", "c": false}]}, {"v": "Een bezorgde buurvrouw meldt dat ze al dagen niets van haar buurman hoort. Je belt aan, niemand doet open. Door het raam zie je hem bewusteloos op de grond liggen. De voordeur zit op slot; de achterdeur heeft een glazen ruit. Je slaat de ruit in om bij hem te komen. Is dat geweld in de zin van de Ambtsinstructie?", "art": "Art. 1 lid 4 sub b Ambtsinstructie", "o": [{"t": "Ja: geweld is ook dwangmatige kracht op zaken", "u": "De definitie luidt: elke dwangmatige kracht van meer dan geringe betekenis, uitgeoefend op personen of zaken. De syllabus noemt de ingeslagen ruit als voorbeeld.", "c": true}, {"t": "Nee: geweld kan alleen tegen personen worden gebruikt", "u": "De definitie noemt uitdrukkelijk ook zaken.", "c": false}, {"t": "Nee: bij hulpverlening is nooit sprake van geweld", "u": "Het doel van het optreden verandert de definitie niet. Hulpverlening kan het geweld wel rechtvaardigen.", "c": false}, {"t": "Alleen als de bewoner later schade claimt", "u": "Of iets geweld is, hangt af van de handeling en niet van een schadeclaim.", "c": false}]}, {"v": "De meldkamer meldt een gewapende overval op een juwelier; de daders zijn mogelijk nog binnen. Je parkeert om de hoek en loopt met je collega naar de winkel. Onderweg neem je je dienstpistool uit de holster en houd je het langs je lichaam, loop omlaag. Je richt niet. Hoe is dit te kwalificeren?", "art": "Art. 1 lid 4 sub c en sub j, art. 17 Ambtsinstructie", "o": [{"t": "Aanwenden van geweld voor de melding, maar geen gebruik van het vuurwapen", "u": "Voor de melding van art. 17 valt het ter hand nemen onder aanwenden van geweld. Gebruik is pas richten, gericht houden of schieten.", "c": true}, {"t": "Gebruik van het vuurwapen, dus altijd registratie door de hOvJ", "u": "Gebruik is richten, gericht houden of schieten. Daarvan is hier geen sprake.", "c": false}, {"t": "Geen aanwenden van geweld, dus geen melding", "u": "De wet rekent het ter hand nemen van het vuurwapen voor de melding uitdrukkelijk tot aanwenden van geweld.", "c": false}, {"t": "Een waarschuwing in de zin van art. 10a", "u": "De waarschuwing van art. 10a is de mededeling dat geschoten zal worden. Het wapen pakken is dat niet.", "c": false}]}, {"v": "Na een melding van overlast bij een winkelcentrum tref je 's avonds een luidruchtige, dreigende groep jongeren aan. Je vraagt meermaals vriendelijk of ze weggaan, zonder resultaat. Je trekt je wapenstok, houdt hem zichtbaar omhoog en roept: 'Weg hier, of ik gebruik de wapenstok!' De groep vertrekt. Moet je dit als geweld melden op grond van art. 17?", "art": "Art. 1 lid 4 sub c Ambtsinstructie; Bijlage 3 syllabus", "o": [{"t": "Nee: dreigen is waarschuwen en geen aanwenden van geweld", "u": "Alleen het gebruiken van geweld valt onder aanwenden. Het meldingsschema van de syllabus noemt ter hand nemen en dreigen met de wapenstok als niet-meldplichtig.", "c": true}, {"t": "Ja: het ter hand nemen van elk geweldmiddel is aanwenden van geweld", "u": "Die regel geldt alleen voor het vuurwapen.", "c": false}, {"t": "Ja: elke waarschuwing moet schriftelijk worden gemeld", "u": "Een waarschuwing is geen aanwenden van geweld en valt niet onder art. 17.", "c": false}, {"t": "Nee, tenzij een van de jongeren een klacht indient", "u": "De meldplicht hangt niet af van een klacht.", "c": false}]}, {"v": "Welk van deze voorwerpen is een geweldmiddel in de zin van de Ambtsinstructie?", "art": "Art. 1 lid 4 sub d Ambtsinstructie", "o": [{"t": "De korte wapenstok", "u": "De wapenstok hoort tot de krachtens art. 22 Politiewet toegelaten bewapening.", "c": true}, {"t": "De handboeien", "u": "Handboeien zijn een vrijheidsbeperkend middel. Geweld met de boeien valt onder art. 7 lid 1 en 7 Politiewet.", "c": false}, {"t": "Het schild van de mobiele eenheid", "u": "Het woord 'uitrusting' is uit de definitie geschrapt. Een schild is uitrusting en geen geweldmiddel.", "c": false}, {"t": "De zaklantaarn", "u": "Een gebruiksvoorwerp waarmee geweld wordt gebruikt, wordt daardoor geen geweldmiddel. Het geweld valt onder art. 7 lid 1 en 7 Politiewet.", "c": false}]}, {"v": "De meldkamer meldt een man met een mes die klanten bedreigt in een tankstation. Je komt ter plaatse en ziet hem bij de kassa met het mes in zijn hand. Je richt je dienstpistool op hem en roept dat hij het moet laten vallen. Hij doet dat; je schiet niet. Heb je het vuurwapen 'gebruikt'?", "art": "Art. 1 lid 4 sub j Ambtsinstructie", "o": [{"t": "Ja: richten en gericht houden zijn gebruik van het vuurwapen", "u": "Gebruik is het richten, het gericht houden of het schieten. Omdat een vuurwapen is gebruikt, registreert de hOvJ de melding altijd (art. 17 lid 3 sub b).", "c": true}, {"t": "Nee: gebruik is alleen het lossen van een schot", "u": "Ook richten en gericht houden vallen onder de definitie.", "c": false}, {"t": "Nee: dit is alleen ter hand nemen", "u": "Ter hand nemen is het wapen in de hand hebben met de loop in een veilige richting. Hier was het wapen op een persoon gericht.", "c": false}, {"t": "Alleen als de verdachte zich bedreigd voelde", "u": "De definitie is objectief en hangt niet af van de beleving van de verdachte.", "c": false}]}, {"v": "Wat is 'verplaatsing' in de zin van de Ambtsinstructie?", "art": "Art. 1 lid 4 sub q Ambtsinstructie", "o": [{"t": "Het overbrengen van een persoon binnen dezelfde locatie, zonder vervoermiddel", "u": "Bijvoorbeeld van de cel naar de verhoorkamer. Het begrip is van belang voor art. 22, 22a en 35a.", "c": true}, {"t": "Het overbrengen van een persoon naar een ander bureau met een dienstvoertuig", "u": "Zodra een vervoermiddel wordt gebruikt, is het vervoer.", "c": false}, {"t": "Het overplaatsen van een ingeslotene naar een huis van bewaring", "u": "Dat is vervoer naar een andere locatie.", "c": false}, {"t": "Elke beweging van een persoon onder politiebegeleiding", "u": "De definitie is beperkt tot dezelfde locatie en zonder vervoermiddel.", "c": false}]}, {"v": "De Ambtsinstructie spreekt in art. 12e over 'de wapenstok'. Welke wapenstokken vallen daaronder?", "art": "Art. 1 lid 6 Ambtsinstructie", "o": [{"t": "De korte en de lange wapenstok", "u": "Lid 6 zegt dat onder wapenstok zowel de korte als de lange wordt verstaan. De uitschuifbare wapenstok is een korte wapenstok.", "c": true}, {"t": "Alleen de korte wapenstok", "u": "Ook de lange wapenstok valt eronder.", "c": false}, {"t": "De korte, de lange en de elektrische wapenstok", "u": "De elektrische wapenstok heeft een eigen artikel (art. 16) en mag alleen tegen agressieve dieren.", "c": false}, {"t": "Elke stok die een ambtenaar in dienst bij zich draagt", "u": "Het gaat om de toegelaten bewapening.", "c": false}]}, {"v": "Je werkt samen met een collega die gecertificeerd is voor het stroomstootwapen (SSW); jij hebt die opleiding niet gevolgd. Na een melding van een vechtpartij worstelt hij ter plaatse met een agressieve man. Zijn SSW valt op de grond, vlak bij jou. Mag jij het op grond van de Ambtsinstructie gebruiken?", "art": "Art. 4 Ambtsinstructie", "o": [{"t": "Nee: het middel is jou niet toegekend en je bent er niet in geoefend", "u": "Art. 4 stelt twee eisen die samen gelden: het middel is je rechtens toegekend en je bent in het gebruik geoefend.", "c": true}, {"t": "Ja: het SSW is een toegelaten geweldmiddel van de politie", "u": "Dat het middel aan de politie is toegelaten, betekent niet dat iedere ambtenaar het mag gebruiken.", "c": false}, {"t": "Ja, als je collega daarvoor toestemming geeft", "u": "Een collega kan de eisen van toekenning en geoefendheid niet opzij zetten.", "c": false}, {"t": "Ja, mits je het gebruik daarna meldt", "u": "Melden is geen vervanging van de bevoegdheid.", "c": false}]}, {"v": "Na een melding van een steekpartij in een park kom je ter plaatse. Het slachtoffer wordt verzorgd. Je spreekt een getuige aan; hij is geen verdachte. Hij houdt zijn hand krampachtig in zijn jaszak, waarin je de vorm van een mes ziet, en loopt dreigend op je af. Mag je zijn kleding onderzoeken?", "art": "Art. 7 lid 3 Politiewet 2012", "o": [{"t": "Ja: er dreigt onmiddellijk gevaar en het onderzoek is nodig", "u": "De veiligheidsfouillering vraagt geen verdenking. Wel nodig: taakuitoefening, onmiddellijk gevaar voor leven of veiligheid dat uit feiten of omstandigheden blijkt, en noodzaak om dat gevaar af te wenden.", "c": true}, {"t": "Nee: fouilleren mag alleen bij een verdachte", "u": "Lid 3 spreekt over personen. Een verdenking is niet vereist.", "c": false}, {"t": "Nee: daarvoor is toestemming van de hOvJ nodig", "u": "De bevoegdheid komt de ambtenaar zelf toe. Wel volgt achteraf een schriftelijke melding aan de hOvJ.", "c": false}, {"t": "Ja: iedereen op een plaats delict mag preventief worden gefouilleerd", "u": "Zonder concrete feiten of omstandigheden die op onmiddellijk gevaar wijzen, bestaat de bevoegdheid niet.", "c": false}]}, {"v": "Je voert met je collega een verkeerscontrole uit op een provinciale weg en houdt een motorrijder staande. Tijdens het gesprek kijkt hij steeds nerveus naar het open bagagevak op de tank en beweegt zijn hand ernaartoe. Je vermoedt een gevaarlijk voorwerp. Dan stapt hij af en loopt op jouw verzoek mee naar je dienstauto, enkele meters van de motor, waar je collega naast hem staat. Mag je het bagagevak nu nog onderzoeken op grond van art. 7 lid 3 Politiewet?", "art": "Art. 7 lid 3 Politiewet 2012 (toelichting syllabus)", "o": [{"t": "Nee: hij kan niet meer bij het vak, dus het gevaar is niet meer onmiddellijk", "u": "Volgens de syllabus vervalt deze grondslag zodra de betrokkene niet meer over het voertuig kan beschikken. Andere bevoegdheden, zoals die van de Wet wapens en munitie, kunnen wel van toepassing zijn.", "c": true}, {"t": "Ja: het vermoeden bestond al voordat hij afstapte", "u": "Het gevaar moet onmiddellijk zijn op het moment van het onderzoek.", "c": false}, {"t": "Ja: een voertuig is een voorwerp dat hij met zich meevoert", "u": "Volgens de syllabus ging de parlementaire behandeling over tassen en rugzakken, niet over voertuigen.", "c": false}, {"t": "Nee: een voertuig mag door de politie nooit worden onderzocht", "u": "Te absoluut. Andere wetten geven wel bevoegdheden om voertuigen te onderzoeken.", "c": false}]}, {"v": "Wat is het wezenlijke verschil tussen de veiligheidsfouillering en de vervoersfouillering?", "art": "Art. 7 lid 3 en lid 4 Politiewet 2012; art. 21 Ambtsinstructie", "o": [{"t": "De eerste eist onmiddellijk gevaar en wordt gemeld; de tweede is standaard vóór vervoer en wordt niet gemeld", "u": "Lid 3 kent de drempel van onmiddellijk gevaar en de meldplicht van art. 21. Lid 4 geldt voor iedere te vervoeren of in te sluiten persoon, zonder meldplicht.", "c": true}, {"t": "De eerste mag bij iedere persoon worden toegepast; de tweede alleen bij verdachten van een misdrijf", "u": "Ook de vervoersfouillering geldt voor iedere persoon die de politie vervoert.", "c": false}, {"t": "De eerste omvat alleen het aftasten van de kleding; de tweede ook het onderzoek van tassen", "u": "Beide omvatten de kleding en de voorwerpen die iemand bij zich draagt of meevoert.", "c": false}, {"t": "Er is geen wezenlijk verschil: beide eisen onmiddellijk gevaar en beide worden gemeld", "u": "Alleen de veiligheidsfouillering wordt gemeld.", "c": false}]}, {"v": "Een aangekondigde demonstratie in het stadscentrum loopt uit de hand: er wordt vuurwerk gegooid en etalages worden vernield. De politie grijpt in om de openbare orde te herstellen. Onder wiens gezag staat de politie daarbij?", "art": "Art. 11 en 12 Politiewet 2012", "o": [{"t": "De burgemeester", "u": "Bij handhaving van de openbare orde en bij hulpverlening staat de politie onder gezag van de burgemeester (art. 11).", "c": true}, {"t": "De officier van justitie", "u": "De officier van justitie heeft het gezag bij strafrechtelijke handhaving van de rechtsorde (art. 12).", "c": false}, {"t": "De korpschef", "u": "De korpschef leidt en beheert het korps, maar is geen gezag.", "c": false}, {"t": "De hulpofficier van justitie", "u": "De hOvJ heeft eigen bevoegdheden, maar is niet het bevoegd gezag.", "c": false}]}, {"v": "Wanneer handel je 'in de rechtmatige uitoefening van je bediening'?", "art": "Art. 7 lid 1 Politiewet 2012; lesdeck Ambtsinstructie & Politiewet (mei 2023)", "o": [{"t": "Als je handelt op basis van een wettelijke taak of bevoegdheid", "u": "Zo wordt het in de les samengevat. Ben je niet bevoegd tot de handeling zelf, zoals een aanhouding, dan mag je daarvoor ook geen geweld gebruiken.", "c": true}, {"t": "Als je in uniform en in diensttijd optreedt", "u": "Uniform en diensttijd zeggen niets over de bevoegdheid voor de handeling.", "c": false}, {"t": "Als een meerdere opdracht heeft gegeven", "u": "Een opdracht maakt een handeling waarvoor de wet geen bevoegdheid geeft niet rechtmatig.", "c": false}, {"t": "Als het geweld achteraf wordt goedgekeurd", "u": "De rechtmatigheid wordt beoordeeld naar het moment van handelen.", "c": false}]}, {"v": "Na een melding van een vechtpartij in een supermarkt houd je een verdachte aan. Hij verzet zich en trekt zijn armen weg. Je kunt hem met je handen onder controle krijgen, maar je pakt toch je wapenstok. Aan welk beginsel, zoals de les dat benoemt, voldoe je niet?", "art": "Art. 7 lid 7 Politiewet 2012; lesdeck (mei 2023)", "o": [{"t": "Redelijk, oftewel subsidiariteit: het gekozen middel", "u": "Er moet evenredigheid zijn tussen het belang en het middel. Kun je het met je handen af, dan gebruik je geen geweldmiddel.", "c": true}, {"t": "Gematigd, oftewel proportionaliteit: de gekozen hoeveelheid", "u": "Gematigd gaat over de hoeveelheid geweld. Hier gaat het om de keuze van het middel.", "c": false}, {"t": "De waarschuwingsplicht", "u": "Die staat hier niet ter discussie.", "c": false}, {"t": "De rechtmatige uitoefening van de bediening", "u": "De aanhouding zelf is rechtmatig; het probleem zit in het middel.", "c": false}]}, {"v": "Bij een aanhouding na een melding van een vechtpartij in een kroeg verzet de verdachte zich heftig. Eén klap met de wapenstok is genoeg om het verzet te breken, maar de agent geeft er drie. Aan welk beginsel, zoals de les dat benoemt, voldoet hij niet?", "art": "Art. 7 lid 7 Politiewet 2012; lesdeck (mei 2023)", "o": [{"t": "Gematigd, oftewel proportionaliteit: de gekozen hoeveelheid", "u": "Er moet evenredigheid zijn tussen het belang en de hoeveelheid geweld. Is één klap voldoende, dan geef je er geen twee.", "c": true}, {"t": "Redelijk, oftewel subsidiariteit: het gekozen middel", "u": "Redelijk gaat over de keuze van het middel. Hier gaat het om de hoeveelheid.", "c": false}, {"t": "Art. 4 Ambtsinstructie: toegekend en geoefend", "u": "Art. 4 gaat over wie het middel mag gebruiken.", "c": false}, {"t": "De meldplicht van art. 17", "u": "De meldplicht geldt achteraf en zegt niets over de hoeveelheid geweld.", "c": false}]}]}, {"key": "wapens", "title": "Geweldmiddelen", "sub": "Vuurwapen, pepperspray, stroomstootwapen, wapenstok", "notes": "<h2>Het vaste stramien<\/h2>\n<p>Elk geweldmiddel heeft een artikel met <strong>limitatieve doelen<\/strong> en een eigen <strong>waarschuwingsartikel<\/strong>. Eerst moet altijd voldaan zijn aan art. 7 lid 1 en 7 Politiewet, daarna aan het doel uit de Ambtsinstructie.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Doel<\/th>\n<th>Vuurwapen (art. 7)<\/th>\n<th>Pepperspray (12a)<\/th>\n<th>SSW schietmodus (12c lid 1)<\/th>\n<th>SSW schokmodus (12c lid 2)<\/th>\n<th>Wapenstok (12e)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Aanhouden gevaarlijke persoon<\/td>\n<td><strong>Vuurwapen<\/strong> bij zich, of aanstonds ander <strong>levensbedreigend<\/strong> geweld<\/td>\n<td><strong>Wapen<\/strong> bij zich, of aanstonds ander geweld<\/td>\n<td>Als pepperspray<\/td>\n<td>Nee<\/td>\n<td>Als pepperspray<\/td>\n<\/tr>\n<tr>\n<td>Aanhouden na onttrekken<\/td>\n<td>Alleen bij misdrijf van <strong>4 jaar of meer<\/strong> plus één van drie extra eisen<\/td>\n<td>Ja<\/td>\n<td>Ja<\/td>\n<td>Nee<\/td>\n<td>Ja<\/td>\n<\/tr>\n<tr>\n<td>Agressieve dieren<\/td>\n<td>Nee (alleen ernstig gewond dier doden)<\/td>\n<td>Ja<\/td>\n<td>Ja<\/td>\n<td>Ja<\/td>\n<td>Nee<\/td>\n<\/tr>\n<tr>\n<td>Op afstand houden<\/td>\n<td>Nee<\/td>\n<td>Nee<\/td>\n<td>Nee<\/td>\n<td>Nee<\/td>\n<td>Ja<\/td>\n<\/tr>\n<tr>\n<td>Verspreiden menigte<\/td>\n<td>Nee (wel: oproer, in gesloten verband)<\/td>\n<td>Nee<\/td>\n<td>Nee<\/td>\n<td>Nee<\/td>\n<td>Ja<\/td>\n<\/tr>\n<tr>\n<td>Afweerbevoegdheid<\/td>\n<td>Ja<\/td>\n<td>Ja<\/td>\n<td>Ja<\/td>\n<td>Ja<\/td>\n<td>Ja<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Vuurwapen<\/h2>\n<p><strong>Gebruik<\/strong> = richten, gericht houden of schieten (art. 1 lid 4 sub j).<\/p>\n<p><strong>Art. 7 lid 1 – gebruik is slechts geoorloofd:<\/strong><\/p>\n<ul>\n<li><strong>a.<\/strong> om een persoon aan te houden van wie redelijkerwijs mag worden aangenomen dat hij (1) een voor onmiddellijk gebruik gereed zijnd <strong>vuurwapen<\/strong> bij zich heeft en dat tegen personen zal gebruiken, of (2) aanstonds ander <strong>levensbedreigend<\/strong> geweld tegen personen zal gebruiken;<\/li>\n<li><strong>b.<\/strong> om een persoon aan te houden die zich aan aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming tracht te onttrekken of heeft onttrokken, <strong>en<\/strong> die wordt verdacht van of is veroordeeld voor een misdrijf met een gevangenisstraf van <strong>vier jaar of meer<\/strong>, <strong>en<\/strong> dat misdrijf (1) vormt een ernstige aantasting van de lichamelijke integriteit, (2) betreft het wederrechtelijk verblijf in een woning of besloten erf met geweld of bedreiging met geweld tegen personen, of (3) is door zijn gevolg bedreigend voor de samenleving;<\/li>\n<li><strong>c en d.<\/strong> beteugelen van oproerige bewegingen of ernstige wanordelijkheden: in opdracht van het bevoegd gezag, in gesloten verband onder leiding van een meerdere;<\/li>\n<li><strong>e.<\/strong> een <strong>ernstig gewond dier<\/strong> doden;<\/li>\n<li><strong>f.<\/strong> direct gevaar voor het leven van personen of voor het ontstaan van zwaar lichamelijk letsel afwenden (<strong>afweerbevoegdheid<\/strong>).<\/li>\n<\/ul>\n<p><strong>Lid 2.<\/strong> In de gevallen a en b géén vuurwapen als de <strong>identiteit bekend<\/strong> is en uitstel van de aanhouding geen onaanvaardbaar gevaar voor de rechtsorde oplevert.<\/p>\n<p><strong>Lid 3.<\/strong> Poging en deelneming tellen mee bij het misdrijf van onderdeel b.<\/p>\n<p><strong>Afweer: waar staat het?<\/strong> Niet in één artikel, maar als één van de gronden per geweldmiddel: vuurwapen art. 7 lid 1 sub f, pepperspray art. 12a sub d, SSW art. 12c sub d, wapenstok art. 12e sub e, hond art. 15a lid 1 sub c; volautomatisch vuur art. 8. Het maakt niet uit wiens leven in gevaar is: ook de persoon zelf vanuit wie het gevaar komt telt mee, bijvoorbeeld bij dreigen met zelfdoding (syllabus, Bijlage 2). Noodweer (art. 41 Sr) is iets anders: een strafuitsluitingsgrond.<\/p>\n<p><strong>Let op bij onderdeel b.<\/strong> Het gaat niet om de lijst van art. 67 Sv. Diefstal (vier jaar) haalt de strafdrempel, maar is geen ernstige aantasting van de lichamelijke integriteit. Op een vluchtende inbreker mag niet zonder meer worden geschoten: er moet een redelijk vermoeden zijn van geweld of bedreiging tegen personen.<\/p>\n<p><strong>Art. 10 – ter hand nemen.<\/strong> Alleen (a) als gebruik van het vuurwapen is toegestaan, of (b) voor de veiligheid van jezelf of anderen, als redelijkerwijs mag worden aangenomen dat een situatie ontstaat waarin je het mag gebruiken. Is die situatie er niet (meer): <strong>terstond opbergen<\/strong>. Ter hand nemen is nog geen gebruik, maar wel aanwenden van geweld voor de melding.<\/p>\n<p><strong>Art. 10a – waarschuwen.<\/strong> Onmiddellijk voordat gericht wordt geschoten: met luide stem of op andere niet mis te verstane wijze waarschuwen <strong>dat geschoten zal worden<\/strong> als het bevel niet onverwijld wordt opgevolgd. Zo nodig vervangen door een <strong>waarschuwingsschot<\/strong>, zo gegeven dat gevaar voor personen of zaken zoveel mogelijk wordt vermeden. Alleen achterwege laten als de omstandigheden de waarschuwing niet toelaten; noteer dat in de melding.<\/p>\n<p><strong>Let op:<\/strong> art. 10a gaat uit van een <strong>bevel<\/strong>: eerst beveel je iets, dan waarschuw je dat er geschoten wordt als het bevel niet wordt opgevolgd. De waarschuwing komt onmiddellijk voordat je gericht schiet, niet eerder. Bij lange afstandsprecisievuur (art. 9) geldt geen waarschuwingsplicht.<\/p>\n<p><strong>Altijd het middel noemen.<\/strong> Bij elk geweldmiddel moet de waarschuwing zeggen welk middel je gebruikt: vuurwapen (art. 10a), pepperspray (art. 12b), stroomstootwapen (art. 12d), wapenstok (art. 12f), hond (art. 15b). Alleen \"ik ga geweld gebruiken\" is niet genoeg. Voorbeeld: \"Politie, doe je wapen weg of ik schiet met mijn vuurwapen!\"<\/p>\n<p>De syllabus noemt twee zaken (rechtbank Zeeland-West-Brabant 2015 en rechtbank Den Haag 2016) waarin agenten schuldig werden verklaard zonder strafoplegging: het schieten kon, maar de waarschuwing ontbrak.<\/p>\n<p><strong>Automatisch vuur (art. 8) en lange afstandsprecisievuur (art. 9).<\/strong> Voorbehouden aan gespecialiseerde eenheden en alleen ter afwending van direct gevaar voor leven of zwaar lichamelijk letsel.<\/p>\n<h2>Pepperspray<\/h2>\n<p><strong>Art. 12a – gebruik is slechts geoorloofd:<\/strong><\/p>\n<ul>\n<li><strong>a.<\/strong> om een persoon aan te houden van wie redelijkerwijs mag worden aangenomen dat hij een voor onmiddellijk gebruik gereed zijnd <strong>wapen<\/strong> bij zich heeft en dit tegen een persoon zal gebruiken, of aanstonds ander geweld tegen personen zal gebruiken;<\/li>\n<li><strong>b.<\/strong> om een persoon aan te houden die zich tracht te onttrekken of heeft onttrokken;<\/li>\n<li><strong>c.<\/strong> ter verdediging tegen of voor het onder controle brengen van <strong>agressieve dieren<\/strong>;<\/li>\n<li><strong>d.<\/strong> afweerbevoegdheid.<\/li>\n<\/ul>\n<p><strong>Wapen<\/strong> is ruim: ook een barkruk, hockeystick of ander voorwerp dat in de situatie als wapen wordt gebruikt. <strong>Ander geweld<\/strong> is bijvoorbeeld slaan of schoppen; het hoeft niet levensbedreigend te zijn.<\/p>\n<p><strong>Onttrekken<\/strong> is vluchten of proberen te vluchten. Volgens de toelichting mag dit niet zo ruim worden gelezen dat passief verzet of enkel niet meewerken tot pepperspray leidt; fysieke technieken hebben dan de voorkeur.<\/p>\n<p>Er is geen wettelijk verbod voor risicogroepen, maar zwangerschap, ademhalingsproblemen, leeftijd en geestelijke gesteldheid wegen mee in de proportionaliteit.<\/p>\n<p><strong>Art. 12b – waarschuwen.<\/strong> Waarschuwen dat <strong>pepperspray<\/strong> gebruikt zal worden. Alleen zeggen dat je geweld gaat gebruiken is niet genoeg. Achterwege laten kan als de omstandigheden de waarschuwing redelijkerwijs niet toelaten.<\/p>\n<h2>Stroomstootwapen (SSW)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Schietmodus (lid 1)<\/th>\n<th>Schokmodus (lid 2)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Werking<\/td>\n<td>Pijltjes op afstand: tijdelijk weerloos<\/td>\n<td>Direct op het lichaam: pijnprikkel<\/td>\n<\/tr>\n<tr>\n<td>Aanhouden (a en b)<\/td>\n<td>Ja<\/td>\n<td><strong>Nee<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Agressieve dieren<\/td>\n<td>Ja<\/td>\n<td>Ja<\/td>\n<\/tr>\n<tr>\n<td>Afweerbevoegdheid<\/td>\n<td>Ja<\/td>\n<td>Ja<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Mist een pijltje en plaats je het wapen op het lichaam <strong>om het stroomcircuit te sluiten<\/strong>, dan geldt dat als gebruik in de <strong>schietmodus<\/strong>.<\/li>\n<li>Het grootste risico is niet de stroom maar de <strong>val<\/strong>. Dat weegt mee in proportionaliteit en subsidiariteit.<\/li>\n<li>Niet langer stroom toedienen dan strikt noodzakelijk.<\/li>\n<li>Volgens de syllabus wordt sinds 1 januari 2022 ook <strong>dreigen met het SSW<\/strong> vastgelegd (mutatie, actie SSWD). Dat is een korpsvoorschrift en geen geweldsmelding op grond van art. 17.<\/li>\n<\/ul>\n<p><strong>Art. 12d – waarschuwen.<\/strong> Waarschuwen dat een <strong>stroomstootwapen<\/strong> gebruikt zal worden. De wet vraagt één waarschuwing; in de training worden er drie aangeleerd.<\/p>\n<h2>Wapenstok<\/h2>\n<p><strong>Art. 12e – gebruik is slechts geoorloofd:<\/strong><\/p>\n<ul>\n<li><strong>a.<\/strong> aanhouden van een persoon met een voor onmiddellijk gebruik gereed zijnd wapen, of die aanstonds ander geweld zal gebruiken;<\/li>\n<li><strong>b.<\/strong> aanhouden van een persoon die zich tracht te onttrekken of heeft onttrokken;<\/li>\n<li><strong>c.<\/strong> een persoon <strong>op afstand houden<\/strong> die een ambtenaar in diens taakuitoefening belemmert of geen gehoor geeft aan een bevoegd gegeven bevel of vordering;<\/li>\n<li><strong>d.<\/strong> verspreiden van samenscholingen of volksmenigten die een <strong>onmiddellijke bedreiging voor de openbare orde<\/strong> vormen;<\/li>\n<li><strong>e.<\/strong> afweerbevoegdheid.<\/li>\n<\/ul>\n<p>Aangeleerd is slaan op de grote spiergroepen: bil, bovenarm, bovenbeen. Volgens de Nationale ombudsman is slaan tegen hoofd, hals en ruggengraat niet geoorloofd; het hof Den Bosch veroordeelde in 2022 een agent voor een slag tegen het hoofd met zwaar letsel.<\/p>\n<p><strong>Art. 12f – waarschuwen.<\/strong> De ambtenaar <strong>of de meerdere onder wiens bevel hij optreedt<\/strong> waarschuwt dat de wapenstok gebruikt zal worden.<\/p>\n<h2>Veelgemaakte fouten<\/h2>\n<ol>\n<li>Het woord <strong>levensbedreigend<\/strong> ook bij pepperspray, SSW of wapenstok lezen. Het staat alleen bij het vuurwapen.<\/li>\n<li>De <strong>vierjaarseis<\/strong> bij pepperspray, SSW of wapenstok toepassen. Die geldt alleen bij vuurwapen en hond.<\/li>\n<li>De schokmodus van het SSW gebruiken om aan te houden.<\/li>\n<li>Het vuurwapen inzetten tegen een agressief dier op de dierengrond. Die grond bestaat bij het vuurwapen niet; alleen de afweerbevoegdheid kan dan gelden.<\/li>\n<li>Een algemene waarschuwing geven in plaats van het middel te noemen.<\/li>\n<\/ol>", "quiz": [{"v": "In welk opzicht is de aanhoudingsgrond van het vuurwapen (art. 7 lid 1 sub a) strenger dan die van pepperspray, stroomstootwapen en wapenstok?", "art": "Art. 7 lid 1 sub a, art. 12a, 12c en 12e Ambtsinstructie", "o": [{"t": "Het vuurwapen eist een vuurwapen bij de verdachte of aanstonds ander levensbedreigend geweld", "u": "Bij de andere middelen volstaat een voor onmiddellijk gebruik gereed zijnd wapen of aanstonds ander geweld. Het woord levensbedreigend staat alleen bij het vuurwapen.", "c": true}, {"t": "Het vuurwapen mag alleen na toestemming van een meerdere worden gebruikt", "u": "Voor gebruik ter aanhouding is geen toestemming vereist, tenzij je onder leiding van een aanwezige meerdere optreedt (art. 5).", "c": false}, {"t": "Het vuurwapen mag alleen tegen verdachten van een misdrijf worden gebruikt", "u": "Onderdeel a stelt geen eis aan het feit waarvan iemand wordt verdacht; het gaat om het gevaar dat van hem uitgaat.", "c": false}, {"t": "Er is geen verschil: de gronden zijn gelijkluidend", "u": "Het verschil zit in 'vuurwapen' tegenover 'wapen' en in 'levensbedreigend geweld' tegenover 'geweld'.", "c": false}]}, {"v": "De meldkamer meldt een winkeldiefstal in een kledingzaak. Je ziet de dader met een gestolen jas wegrennen en roept dat hij moet stoppen; hij rent door. Diefstal kent een strafmaximum van vier jaar. Hij is ongewapend, gebruikt geen geweld en er is niemand gewond. Mag het vuurwapen worden gebruikt om hem aan te houden?", "art": "Art. 7 lid 1 sub b Ambtsinstructie", "o": [{"t": "Nee: de strafdrempel is gehaald, maar diefstal voldoet aan geen van de drie aanvullende eisen", "u": "Naast vier jaar of meer moet het misdrijf een ernstige aantasting van de lichamelijke integriteit zijn, een woningfeit met geweld of bedreiging tegen personen, of door zijn gevolg bedreigend voor de samenleving.", "c": true}, {"t": "Ja: hij onttrekt zich aan zijn aanhouding en op het feit staat vier jaar", "u": "Onttrekken en de strafdrempel zijn niet genoeg; de aanvullende eis ontbreekt.", "c": false}, {"t": "Ja, mits eerst een waarschuwingsschot is gegeven", "u": "Een waarschuwing maakt gebruik zonder geldige grond niet geoorloofd.", "c": false}, {"t": "Nee: het vuurwapen mag nooit worden gebruikt tegen iemand die vlucht", "u": "Onderdeel b ziet juist op personen die zich onttrekken, maar alleen onder de genoemde eisen.", "c": false}]}, {"v": "Bewoners betrappen 's nachts een inbreker in hun woning en bellen 112. Je komt met je collega ter plaatse en ziet de man door de achtertuin vluchten. De bewoners vertellen dat hij niemand is tegengekomen, niemand heeft bedreigd en geen geweld heeft gebruikt. Mag je het vuurwapen gebruiken om hem aan te houden?", "art": "Art. 7 lid 1 sub b onder 2° Ambtsinstructie", "o": [{"t": "Nee: het woningfeit telt alleen als er geweld of bedreiging met geweld tegen personen bij is gebruikt", "u": "De toelichting zegt uitdrukkelijk dat niet zonder meer op een vluchtende inbreker mag worden geschoten. Er moet een redelijk vermoeden zijn van geweld of bedreiging tegen bewoners of ambtenaren.", "c": true}, {"t": "Ja: inbraak in een woning is altijd een ernstige aantasting van de lichamelijke integriteit", "u": "Een inbraak zonder geweld tast de lichamelijke integriteit niet aan. De oude grond 'persoonlijke levenssfeer' is per 1 juli 2022 vervallen.", "c": false}, {"t": "Ja: op inbraak staat meer dan vier jaar gevangenisstraf", "u": "De strafdrempel alleen is niet voldoende.", "c": false}, {"t": "Nee: buiten de woning mag het vuurwapen niet meer worden gebruikt", "u": "Bij een woningfeit mét geweld mag de aanhouding ook buiten de woning plaatsvinden. Het ontbreken van geweld is hier beslissend.", "c": false}]}, {"v": "Twee dagen na een gewapende overval op een tankstation is de verdachte via camerabeelden herkend: zijn naam en adres zijn bekend en de aanhouding thuis wordt voorbereid. Tijdens je surveillance zie je hem toevallig een supermarkt uit komen. Hij ziet je en rent weg. Niets wijst op acuut gevaar en een aanhouding thuis is goed te plannen. Mag je het vuurwapen gebruiken om hem nu aan te houden?", "art": "Art. 7 lid 2 Ambtsinstructie", "o": [{"t": "Nee: zijn identiteit is bekend en uitstel is niet gevaarlijk", "u": "Lid 2: geen vuurwapen ter aanhouding als de identiteit bekend is en uitstel geen onaanvaardbaar gevaar voor de rechtsorde oplevert. Het geldt voor de gronden a en b.", "c": true}, {"t": "Ja: een gewapende overval voldoet aan alle eisen van onderdeel b", "u": "De eisen van onderdeel b zijn vervuld, maar lid 2 stelt daar een extra grens aan.", "c": false}, {"t": "Ja: een bekende identiteit speelt alleen een rol bij pepperspray", "u": "Lid 2 hoort bij het vuurwapenartikel.", "c": false}, {"t": "Nee: het vuurwapen mag nooit worden gebruikt als de identiteit bekend is", "u": "Te absoluut. Levert uitstel wel onaanvaardbaar gevaar op, zoals bij een serieverkrachter die elk moment opnieuw kan toeslaan, dan mag het wel.", "c": false}]}, {"v": "De meldkamer meldt een aangereden ree op een provinciale weg. Je komt ter plaatse: het dier ligt met gebroken poten in de berm en lijdt zichtbaar. Een dierenarts kan er pas over een uur zijn. Mag je het dier met je dienstpistool doden?", "art": "Art. 7 lid 1 sub e Ambtsinstructie", "o": [{"t": "Ja: het vuurwapen mag worden gebruikt om een ernstig gewond dier te doden", "u": "Onderdeel e. Volgens de toelichting gaat het om de situatie waarin de komst van een dierenarts door het lijden niet kan worden afgewacht.", "c": true}, {"t": "Ja, maar alleen op grond van de afweerbevoegdheid", "u": "De afweerbevoegdheid vraagt direct gevaar voor personen. Dat speelt hier niet.", "c": false}, {"t": "Nee: het vuurwapen mag alleen tegen personen worden gebruikt", "u": "Onderdeel e noemt het gewonde dier uitdrukkelijk.", "c": false}, {"t": "Nee: dit is voorbehouden aan een jachtopzichter", "u": "De bevoegdheid komt de ambtenaar zelf toe.", "c": false}]}, {"v": "Er komt een melding binnen van een losgebroken stier bij een weiland naast een speelveld. Je komt aan en ziet de stier op een groep spelende kinderen afstormen, die niet op tijd weg kunnen. Mag je je vuurwapen gebruiken, en op welke grond?", "art": "Art. 7 lid 1 sub f Ambtsinstructie", "o": [{"t": "Ja, op grond van de afweerbevoegdheid", "u": "Direct gevaar voor leven of zwaar lichamelijk letsel van personen. Het vuurwapenartikel kent geen grond 'agressieve dieren'; alleen onderdeel f kan hier gelden.", "c": true}, {"t": "Ja, op de grond 'verdediging tegen agressieve dieren'", "u": "Die grond staat bij pepperspray en stroomstootwapen, niet bij het vuurwapen.", "c": false}, {"t": "Ja, op de grond 'een ernstig gewond dier doden'", "u": "De stier is niet gewond. Onderdeel e ziet op lijdende dieren.", "c": false}, {"t": "Nee: tegen dieren mag alleen pepperspray worden gebruikt", "u": "De afweerbevoegdheid maakt geen onderscheid naar de bron van het gevaar.", "c": false}]}, {"v": "Je rijdt met spoed naar een melding: gewapende overval op een woning, de daders zijn mogelijk nog binnen. Je stopt voor de woning en bij de voordeur neem je je dienstpistool in de hand. Is dat toegestaan?", "art": "Art. 10 lid 1 sub b Ambtsinstructie", "o": [{"t": "Ja: voor je veiligheid, omdat een situatie kan ontstaan waarin je het mag gebruiken", "u": "Art. 10 lid 1 sub b: als redelijkerwijs mag worden aangenomen dat een situatie ontstaat waarin je het vuurwapen mag gebruiken. Achteraf meld je het ter hand nemen aan de hOvJ.", "c": true}, {"t": "Nee: ter hand nemen mag pas als aan een grond van art. 7 is voldaan", "u": "Dat is onderdeel a. Onderdeel b laat het uit voorzorg toe.", "c": false}, {"t": "Ja, maar alleen na toestemming van de officier van dienst ter plaatse", "u": "Art. 10 stelt geen toestemmingseis.", "c": false}, {"t": "Ja: het dienstpistool mag bij elke melding ter hand worden genomen", "u": "Zonder de verwachting van onderdeel b, of een grond van art. 7, mag het niet.", "c": false}]}, {"v": "Bij een melding van een gewapende overval op een woning heb je je dienstpistool ter hand genomen. Je zoekt met je collega de woning af: die blijkt leeg en de melding blijkt vals. Je loopt met het pistool nog in de hand terug naar de auto. Wat schrijft de Ambtsinstructie voor?", "art": "Art. 10 lid 2 Ambtsinstructie", "o": [{"t": "Het vuurwapen terstond opbergen", "u": "Doet de situatie van lid 1 sub b zich niet of niet meer voor, dan berg je het wapen terstond op.", "c": true}, {"t": "Het vuurwapen in de hand houden tot je weer in het voertuig zit", "u": "De grond voor het ter hand nemen is weggevallen.", "c": false}, {"t": "Het vuurwapen opbergen zodra de hOvJ daarvoor toestemming geeft", "u": "Opbergen is een eigen plicht van de ambtenaar.", "c": false}, {"t": "Niets: over opbergen bepaalt de Ambtsinstructie niets", "u": "Art. 10 lid 2 regelt dit uitdrukkelijk.", "c": false}]}, {"v": "Hoe moet je waarschuwen voordat je gericht met je vuurwapen schiet?", "art": "Art. 10a Ambtsinstructie", "o": [{"t": "Duidelijk maken dat geschoten zal worden als het bevel niet wordt opgevolgd", "u": "Met luide stem of op andere niet mis te verstane wijze. Bijvoorbeeld: 'Laat vallen dat mes, of ik schiet!' Zo nodig kan een waarschuwingsschot de waarschuwing vervangen.", "c": true}, {"t": "Roepen dat je geweld gaat gebruiken als het bevel niet wordt opgevolgd", "u": "De waarschuwing moet duidelijk maken dat geschoten zal worden.", "c": false}, {"t": "Altijd eerst een waarschuwingsschot geven en daarna mondeling waarschuwen", "u": "Het waarschuwingsschot kan de mondelinge waarschuwing zo nodig vervangen; het is geen verplichte eerste stap.", "c": false}, {"t": "Driemaal 'Politie!' roepen en daarna enkele seconden wachten", "u": "De wet noemt geen aantal en geen wachttijd; de inhoud van de waarschuwing is bepalend.", "c": false}]}, {"v": "Na een melding van een gewapende overval vluchten de daders te voet; jullie zetten de achtervolging in. Een agent schiet een vluchtende, gevaarlijke verdachte in het been. De grond van art. 7 was aanwezig, maar hij waarschuwde niet, terwijl dat wel kon. Wat leert de rechtspraak die de syllabus aanhaalt?", "art": "Art. 10a Ambtsinstructie; Rb. Zeeland-West-Brabant 2015, Rb. Den Haag 2016", "o": [{"t": "Het ontbreken van de waarschuwing kan tot een schuldigverklaring leiden", "u": "In beide zaken werden agenten schuldig verklaard zonder oplegging van straf, omdat niet aan art. 10a was voldaan.", "c": true}, {"t": "De waarschuwing is een ordevoorschrift waaraan geen gevolgen zijn verbonden", "u": "De rechtspraak laat het tegendeel zien.", "c": false}, {"t": "De waarschuwing is alleen verplicht als een waarschuwingsschot wordt gegeven", "u": "De waarschuwing gaat aan het gerichte schot vooraf.", "c": false}, {"t": "Het slagen van de aanhouding heft het ontbreken van de waarschuwing op", "u": "Het resultaat herstelt het verzuim niet.", "c": false}]}, {"v": "Je wordt gestuurd naar een melding van een vechtpartij in een vol café. Ter plaatse zie je een getrainde vechter die de aanwezigen bedreigt; de mensen staan dicht op elkaar en er ligt glaswerk op de vloer. Je overweegt het stroomstootwapen. Welk risico moet je volgens de syllabus vooral meewegen?", "art": "Art. 12c Ambtsinstructie (toelichting); art. 7 lid 1 en 7 Politiewet 2012", "o": [{"t": "Dat de persoon verstijft en daardoor ongelukkig valt", "u": "Bij correct gebruik is de kans op blijvend letsel door de stroom zelf klein. Het valgevaar is het grootste risico en hoort in de afweging.", "c": true}, {"t": "Dat de stroomstoot blijvende hartschade veroorzaakt", "u": "Volgens het aangehaalde onderzoek is die kans bij correct gebruik erg klein.", "c": false}, {"t": "Dat omstanders via de vloer onder stroom komen te staan", "u": "Dat risico noemt de syllabus niet.", "c": false}, {"t": "Geen: het SSW is het lichtste geweldmiddel", "u": "Ook bij het SSW moeten proportionaliteit en subsidiariteit worden afgewogen.", "c": false}]}, {"v": "Na een melding van een bedreiging in een kroeg ben je bezig een man aan te houden. Hij verzet zich, grijpt een barkruk en tilt die dreigend boven zijn hoofd. Kan dit een grond voor pepperspray opleveren?", "art": "Art. 12a sub a Ambtsinstructie", "o": [{"t": "Ja: een voorwerp dat in de situatie als wapen wordt gebruikt, telt als wapen", "u": "Onder wapen vallen ook gebruiksvoorwerpen zoals een barkruk of hockeystick. Uit zijn gedrag blijkt dat hij het tegen een persoon zal gebruiken.", "c": true}, {"t": "Nee: pepperspray vereist dat de verdachte een vuurwapen heeft", "u": "Dat is de eis bij vuurwapen en hond. Bij pepperspray staat 'wapen'.", "c": false}, {"t": "Nee: een barkruk valt niet onder de Wet wapens en munitie", "u": "Het begrip wapen is hier ruimer dan de wapens van die wet.", "c": false}, {"t": "Ja, maar alleen als het geweld levensbedreigend is", "u": "Het woord levensbedreigend staat alleen in het vuurwapenartikel.", "c": false}]}, {"v": "Een demonstratie blokkeert de ingang van het gemeentehuis. Je houdt een demonstrant aan; hij gaat op de grond zitten en weigert op te staan. Hij is niet agressief en probeert niet weg te komen. Is pepperspray toegestaan om hem mee te krijgen?", "art": "Art. 12a sub b Ambtsinstructie (toelichting); art. 7 lid 1 Politiewet 2012", "o": [{"t": "Nee: passief verzet is geen onttrekken", "u": "Volgens de toelichting mag 'onttrekken' niet zo ruim worden gelezen dat passief verzet tot pepperspray leidt. Er is bovendien een lichter middel: fysieke aanhoudingstechnieken.", "c": true}, {"t": "Ja: wie niet meewerkt, onttrekt zich aan zijn aanhouding", "u": "Onttrekken is vluchten of proberen te vluchten.", "c": false}, {"t": "Ja, mits je eerst waarschuwt", "u": "Een waarschuwing schept geen grond.", "c": false}, {"t": "Nee: pepperspray mag alleen tegen gewapende personen", "u": "Te beperkt. Ook aanstonds ander geweld, onttrekken, agressieve dieren en afweer zijn gronden.", "c": false}]}, {"v": "Na een melding van een vechtpartij op straat wil een man zich onttrekken aan zijn aanhouding. Je besluit de pepperspray te gebruiken en roept: 'Stop, of ik gebruik geweld!' Voldoet dit aan art. 12b?", "art": "Art. 12b Ambtsinstructie", "o": [{"t": "Nee: je moet het middel noemen", "u": "De waarschuwing moet duidelijk maken dat pepperspray wordt gebruikt. Volgens de toelichting is alleen zeggen dat geweld wordt aangewend niet voldoende. Zeg bijvoorbeeld: '...of ik gebruik pepperspray!'", "c": true}, {"t": "Ja: elke waarschuwing voor geweld is voldoende", "u": "Dat is de algemene waarschuwing van art. 7 lid 1 Politiewet. Art. 12b vraagt een specifieke.", "c": false}, {"t": "Ja, als je de bus daarbij zichtbaar vasthoudt", "u": "De toelichting eist dat de ander begrijpt dat pepperspray volgt; noem het middel.", "c": false}, {"t": "Nee: voor pepperspray geldt geen waarschuwingsplicht", "u": "Art. 12b legt die plicht juist op, tenzij de omstandigheden waarschuwen redelijkerwijs niet toelaten.", "c": false}]}, {"v": "Na een melding van fietsendiefstal heb je een verdachte ter plaatse aangehouden. Hij probeert weg te rennen. Je grijpt hem vast en overweegt het stroomstootwapen in de schokmodus tegen zijn been te zetten zodat hij stopt. Is dat toegestaan?", "art": "Art. 12c lid 2 Ambtsinstructie", "o": [{"t": "Nee: de schokmodus is niet toegelaten ter aanhouding", "u": "De schokmodus mag alleen tegen agressieve dieren en ter afwending van direct gevaar voor leven of zwaar lichamelijk letsel. Aanhouden kan alleen met de schietmodus.", "c": true}, {"t": "Ja: onttrekken aan aanhouding is een grond voor beide modi", "u": "Onttrekken is alleen een grond voor de schietmodus.", "c": false}, {"t": "Ja, mits je vooraf waarschuwt", "u": "De waarschuwing vervangt de ontbrekende grond niet.", "c": false}, {"t": "Nee: het stroomstootwapen mag nooit ter aanhouding worden gebruikt", "u": "In de schietmodus mag dat wel.", "c": false}]}, {"v": "De meldkamer meldt een man met een mes die zijn buurvrouw bedreigt. Je komt ter plaatse en schiet het stroomstootwapen af op de gewapende verdachte. Eén pijltje mist. Je plaatst het wapen op zijn lichaam om het stroomcircuit te sluiten. Hoe wordt dit gebruik beoordeeld?", "art": "Art. 12c Ambtsinstructie (nota van toelichting)", "o": [{"t": "Als gebruik in de schietmodus", "u": "Zo sluit je het circuit met het wel geraakte pijltje. Werking en gevaren zijn dan gelijk aan de schietmodus.", "c": true}, {"t": "Als gebruik in de schokmodus, dus niet toegestaan ter aanhouding", "u": "Het gaat hier niet om een pijnprikkel maar om het voltooien van de schietmodus.", "c": false}, {"t": "Als fysiek geweld buiten de Ambtsinstructie", "u": "Het blijft gebruik van het stroomstootwapen.", "c": false}, {"t": "Als een nieuw gebruik waarvoor opnieuw moet worden gewaarschuwd", "u": "De toelichting rekent dit tot hetzelfde gebruik in de schietmodus.", "c": false}]}, {"v": "Na een melding van een agressieve man in een buurthuis kom je ter plaatse. Hij loopt schreeuwend op je af. Je richt het stroomstootwapen op hem en roept: 'Ga liggen, of ik geef stroom!' Hij gaat liggen; je gebruikt het wapen niet. Wat volgt er volgens de syllabus?", "art": "Art. 1 lid 4 sub c Ambtsinstructie; brief korpschef 1 januari 2022 (Bijlage 3 syllabus)", "o": [{"t": "Geen geweldsmelding, wel vastlegging in een mutatie onder actie SSWD", "u": "Dreigen is geen aanwenden van geweld. Voor het SSW geldt sinds 1 januari 2022 volgens de syllabus wel dat elke vorm van dreigen wordt vastgelegd.", "c": true}, {"t": "Een geweldsmelding op grond van art. 17, want het SSW is gebruikt", "u": "Er is geen stroom toegediend. Het was een waarschuwing.", "c": false}, {"t": "Niets: dreigen hoeft nooit te worden vastgelegd", "u": "Dat geldt voor de andere middelen; voor het SSW noemt de syllabus de uitzondering.", "c": false}, {"t": "Een melding aan de officier van justitie", "u": "Kennisgeving aan de officier loopt via de korpschef en alleen in de zware gevallen van art. 18.", "c": false}]}, {"v": "Bij een aanrijding op een drukke kruising regel je het verkeer en help je de gewonden. Een omstander hindert je voortdurend: hij duwt tegen je aan en negeert je herhaalde bevel om afstand te houden. Je wilt hem niet aanhouden. Is de wapenstok een toegelaten middel?", "art": "Art. 12e sub c Ambtsinstructie", "o": [{"t": "Ja: om iemand op afstand te houden die je in je taak belemmert", "u": "Onderdeel c is een zelfstandig doel. De eisen van art. 7 Politiewet blijven gelden: kan het met de handen, dan gebruik je geen wapenstok.", "c": true}, {"t": "Nee: de wapenstok mag alleen ter aanhouding of ter afwending van gevaar", "u": "Art. 12e kent vijf doelen, waaronder op afstand houden.", "c": false}, {"t": "Ja, maar alleen bij optreden van de mobiele eenheid", "u": "Onderdeel c is niet aan de mobiele eenheid gebonden.", "c": false}, {"t": "Nee: daarvoor is toestemming van de burgemeester nodig", "u": "Voor de wapenstok geldt geen toestemmingseis.", "c": false}]}, {"v": "Na een melding van een vechtpartij in het uitgaansgebied houdt een agent een verdachte aan die zich verzet. Hij slaat met de uitschuifbare wapenstok tegen het hoofd van de verdachte, met zwaar letsel tot gevolg. Hoe beoordelen de bronnen die de syllabus noemt dit?", "art": "Art. 12e Ambtsinstructie; art. 7 lid 7 Politiewet 2012; Hof 's-Hertogenbosch 18 februari 2022", "o": [{"t": "Als disproportioneel: slaan hoort op de grote spiergroepen", "u": "De Nationale ombudsman noemt bil, bovenarm en bovenbeen; slaan tegen hoofd, hals en ruggengraat acht hij niet geoorloofd. Het hof veroordeelde een agent voor een slag tegen het hoofd.", "c": true}, {"t": "Als toegestaan, omdat de Ambtsinstructie geen lichaamsdelen noemt", "u": "De tekst noemt ze niet, maar art. 7 lid 7 Politiewet eist redelijk en gematigd geweld.", "c": false}, {"t": "Als toegestaan, mits vooraf is gewaarschuwd", "u": "Een waarschuwing maakt disproportioneel geweld niet proportioneel.", "c": false}, {"t": "Als onrechtmatig, omdat slaan met de wapenstok nooit mag", "u": "Slaan mag binnen de doelen van art. 12e en de eisen van art. 7 Politiewet.", "c": false}]}, {"v": "Bij welke geweldmiddelen geldt voor aanhouden na onttrekken de eis van een misdrijf met vier jaar of meer gevangenisstraf?", "art": "Art. 7 lid 1 sub b en art. 15a lid 1 sub b Ambtsinstructie", "o": [{"t": "Bij het vuurwapen en bij de surveillance- of AOT-hond", "u": "Alleen in art. 7 en art. 15a staat de vierjaarseis. Het vuurwapen kent daarbovenop drie aanvullende eisen.", "c": true}, {"t": "Bij alle geweldmiddelen", "u": "Bij pepperspray, stroomstootwapen en wapenstok ontbreekt de eis.", "c": false}, {"t": "Alleen bij het vuurwapen", "u": "Ook bij de hond geldt de eis.", "c": false}, {"t": "Bij het vuurwapen en het stroomstootwapen", "u": "Voor het stroomstootwapen geldt de eis niet.", "c": false}]}, {"v": "Welke eis stelt art. 10a lid 2 aan een waarschuwingsschot?", "art": "Art. 10a lid 2 Ambtsinstructie", "o": [{"t": "Gevaar voor personen of zaken wordt zoveel mogelijk vermeden", "u": "Het schot wordt zo gegeven dat het zo min mogelijk gevaar oplevert. Het telt als gebruik van het vuurwapen en wordt gemeld.", "c": true}, {"t": "Het schot wordt altijd recht omhoog in de lucht gelost", "u": "De wet schrijft geen richting voor; het gaat om het vermijden van gevaar.", "c": false}, {"t": "Het schot mag pas na een mondelinge waarschuwing", "u": "Het waarschuwingsschot kan de mondelinge waarschuwing zo nodig vervangen.", "c": false}, {"t": "Het schot vereist toestemming van een meerdere", "u": "Art. 10a kent geen toestemmingseis.", "c": false}]}, {"v": "Welke gronden gelden bij het stroomstootwapen voor zowel de schietmodus als de schokmodus?", "art": "Art. 12c lid 1 en lid 2 Ambtsinstructie", "o": [{"t": "Agressieve dieren en de afweerbevoegdheid", "u": "De twee aanhoudingsgronden gelden alleen voor de schietmodus.", "c": true}, {"t": "Aanhouden van een gewapende persoon en de afweerbevoegdheid", "u": "Aanhouden kan alleen in de schietmodus.", "c": false}, {"t": "Aanhouden na onttrekken en agressieve dieren", "u": "Aanhouden na onttrekken kan alleen in de schietmodus.", "c": false}, {"t": "Alle vier de gronden gelden voor beide modi", "u": "De schokmodus kent alleen de dierengrond en de afweerbevoegdheid.", "c": false}]}]}, {"key": "procedures", "title": "Hond, melden, fouilleren, boeien", "sub": "Art. 15 t/m 23 Ambtsinstructie", "notes": "<h2>Surveillancehond en AOT-hond<\/h2>\n<p>De Ambtsinstructie gaat alleen over de hond <strong>als geweldmiddel<\/strong>. Alleen laten zoeken (revieren) valt er niet onder.<\/p>\n<p><strong>Art. 15 – inzet.<\/strong> Altijd onder <strong>direct en voortdurend toezicht van een geleider<\/strong>.<\/p>\n<ul>\n<li>Surveillancehond: bij de surveillancedienst, bij optreden van de mobiele eenheid (na toestemming bevoegd gezag) en bij bewaken en beveiligen.<\/li>\n<li>AOT-hond: bij optreden van een aanhoudings- en ondersteuningsteam of bijstandseenheid, na toestemming van het bevoegd gezag.<\/li>\n<\/ul>\n<p><strong>Art. 15a – inzet als geweldmiddel is slechts geoorloofd:<\/strong><\/p>\n<ul>\n<li><strong>lid 1 a.<\/strong> aanhouden van een persoon van wie redelijkerwijs mag worden aangenomen dat hij een voor onmiddellijk gebruik gereed zijnd <strong>vuurwapen<\/strong> bij zich heeft en dat tegen personen zal gebruiken, dan wel aanstonds ander geweld tegen personen zal gebruiken;<\/li>\n<li><strong>lid 1 b.<\/strong> aanhouden van een persoon die zich tracht te onttrekken of heeft onttrokken <strong>en<\/strong> wordt verdacht van of is veroordeeld voor een misdrijf met <strong>vier jaar of meer<\/strong> gevangenisstraf (zonder de drie extra eisen van het vuurwapen);<\/li>\n<li><strong>lid 1 c.<\/strong> afweerbevoegdheid;<\/li>\n<li><strong>lid 2.<\/strong> verspreiden van samenscholingen of volksmenigten die een <strong>ernstige en onmiddellijke<\/strong> bedreiging vormen voor de veiligheid van personen of zaken. Deze inzet gebeurt <strong>aangelijnd<\/strong>.<\/li>\n<\/ul>\n<p><strong>Art. 15b – waarschuwen.<\/strong> Waarschuwen dat de hond ingezet zal worden, met luide stem of op andere niet mis te verstane wijze. Achterwege laten kan als de omstandigheden de waarschuwing redelijkerwijs niet toelaten.<\/p>\n<h2>Geweld melden<\/h2>\n<p>Drie stappen met elk een eigen drempel:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Stap<\/th>\n<th>Wie<\/th>\n<th>Wanneer<\/th>\n<th>Termijn<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Melden<\/strong> (art. 17 lid 1)<\/td>\n<td>De ambtenaar die geweld heeft aangewend<\/td>\n<td><strong>Altijd<\/strong> na aanwenden van geweld<\/td>\n<td>Zo spoedig mogelijk<\/td>\n<\/tr>\n<tr>\n<td><strong>Registreren<\/strong> (art. 17 lid 3)<\/td>\n<td>De hOvJ<\/td>\n<td>(a) dood of lichamelijk letsel van meer dan geringe betekenis, (b) gebruik van een vuurwapen, (c) naar het oordeel van de hOvJ<\/td>\n<td>Zo spoedig mogelijk<\/td>\n<\/tr>\n<tr>\n<td><strong>Kennisgeving aan de OvJ<\/strong> (art. 18)<\/td>\n<td>De korpschef<\/td>\n<td>Dood of zwaar lichamelijk letsel (of ernstig rekening houden met zwaar letsel); vuurwapengebruik met enig lichamelijk letsel<\/td>\n<td><strong>Terstond<\/strong><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>Als de korpschef daartoe aanleiding ziet<\/td>\n<td>Zo spoedig mogelijk<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>De melding zelf (art. 17 lid 1):<\/strong><\/p>\n<ul>\n<li><strong>schriftelijk<\/strong> (in de praktijk met het <strong>i8-formulier<\/strong>): de aard van het geweld, waaronder het gebruikte geweldmiddel, en de gevolgen;<\/li>\n<li><strong>mondeling<\/strong>: de feiten en omstandigheden, waaronder de redenen;<\/li>\n<li>aan de hOvJ die met de registratie van geweld is belast.<\/li>\n<\/ul>\n<p><strong>Lid 2.<\/strong> Is geweld aangewend na uitdrukkelijke last van een ter plaatse aanwezige meerdere, dan meldt <strong>de meerdere<\/strong>. Jij geeft desgevraagd inlichtingen.<\/p>\n<p><strong>Letsel van meer dan geringe betekenis<\/strong>: letsel dat door een arts of verpleegkundige is of zou moeten worden behandeld. Een enkele blauwe plek of schram valt er niet onder.<\/p>\n<p>Daarnaast geldt de verbaliseringsplicht van art. 152 Sv: geweld hoort in het proces-verbaal.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Handeling<\/th>\n<th>Aanwenden van geweld?<\/th>\n<th>Melden?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Waarschuwen of dreigen (wapenstok, pepperspray, hond)<\/td>\n<td>Nee<\/td>\n<td>Nee<\/td>\n<\/tr>\n<tr>\n<td>Fysiek geweld, gebruik van een geweldmiddel<\/td>\n<td>Ja<\/td>\n<td>Ja, art. 17<\/td>\n<\/tr>\n<tr>\n<td>Vuurwapen ter hand nemen<\/td>\n<td>Ja<\/td>\n<td>Ja, art. 17<\/td>\n<\/tr>\n<tr>\n<td>Waarschuwingsschot<\/td>\n<td>Ja, en gebruik vuurwapen<\/td>\n<td>Ja, art. 17, altijd registratie<\/td>\n<\/tr>\n<tr>\n<td>Handboeien aanleggen zonder verzet<\/td>\n<td>Nee<\/td>\n<td>Ja, art. 23<\/td>\n<\/tr>\n<tr>\n<td>Veiligheidsfouillering<\/td>\n<td>Nee<\/td>\n<td>Ja, art. 21<\/td>\n<\/tr>\n<tr>\n<td>Vervoersfouillering<\/td>\n<td>Nee<\/td>\n<td>Nee<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Fouilleren: de uitvoering<\/h2>\n<p><strong>Art. 20.<\/strong> Het onderzoek aan de kleding bij de veiligheids- en vervoersfouillering gebeurt door <strong>oppervlakkig aftasten<\/strong>, zo veel mogelijk door een ambtenaar van <strong>hetzelfde geslacht<\/strong>. Voel je een voorwerp dat gevaarlijk kan zijn, dan mag je het uit de kleding halen; dat hoort bij de bevoegdheid. Gevaarlijke voorwerpen neem je in bewaring.<\/p>\n<p><strong>Art. 21.<\/strong> De veiligheidsfouillering meld je <strong>onverwijld schriftelijk<\/strong> aan de hOvJ, met de redenen.<\/p>\n<p>De vervoersfouillering geldt alleen voor vervoer <strong>door de politie<\/strong>. Voor iemand die zonder politiebegeleiding met de ambulance meegaat, kan zij volgens de syllabus niet dienen.<\/p>\n<h2>Handboeien en mondafscherming<\/h2>\n<p><strong>Art. 22 – handboeien.<\/strong> Voor vervoer of verplaatsing, bij een persoon die <strong>rechtens van zijn vrijheid is beroofd<\/strong>, als op grond van feiten of omstandigheden redelijkerwijs gevaar te vrezen valt voor:<\/p>\n<ul>\n<li><strong>a.<\/strong> ontvluchting, of<\/li>\n<li><strong>b.<\/strong> de veiligheid van de persoon zelf, de ambtenaar of derden.<\/li>\n<\/ul>\n<p>Standaard boeien mag niet. Verblijf in de cel met handboeien om mag niet. De benen boeien van iemand die wild schopt valt onder art. 7 lid 1 en 7 Politiewet, niet onder art. 22.<\/p>\n<p><strong>Art. 22a – mondafscherming.<\/strong> Voor vervoer of verplaatsing van een persoon die rechtens van zijn vrijheid is beroofd, alleen als feiten of omstandigheden dit redelijkerwijs vereisen voor de veiligheid van de ambtenaar of derden. Het mag ook preventief, als de feiten of omstandigheden het redelijkerwijs vereisen. Volgens de toelichting kan een bekende van de politie die de ambtenaar recent meermaals heeft bespuugd daarvoor aanleiding zijn. Eén incident van lang geleden is te weinig.<\/p>\n<p><strong>Art. 22b – hulpverlening.<\/strong> Art. 22 <strong>onder b<\/strong> en art. 22a gelden ook voor iemand die voor hulpverle

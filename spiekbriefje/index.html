.res{border-top:1px solid var(--line);padding:10px 0}

.mn{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:700;margin-bottom:12px}
a.wl{color:var(--acc);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
</style>

 ["Fouilleren","Opsporingsfouillering art. 56 Sv","Buiten de RTGP-toets. Aangehouden verdachte, ernstige bezwaren, belang van het onderzoek."],
 ["Ingeslotenen","Art. 35a","24 uur na toestemming hOvJ; bij spoed 3 uur; vijf hulpmiddelen: helm, handschoenen, mondafscherming, polsbanden, enkelbanden met tussenstuk."]
];
var INDEX = null;

var LAWS={AI:["BWBR0006589","Ambtsinstructie"],PW:["BWBR0031788","Politiewet 2012"],BBUP:["BWBR0032136","Besluit bewapening en uitrusting politie"],SR:["BWBR0001854","Wetboek van Strafrecht"],SV:["BWBR0001903","Wetboek van Strafvordering"],EVRM:["BWBV0001000","EVRM"]};
var REF=/\b[Aa]rt(?:ikel|\.)\s+(\d+[a-z]?)((?:\s+lid\s+\d+)?(?:\s+en\s+\d+)?(?:\s+sub\s+[a-z])?)(\s+(?:AI|Politiewet(?: 2012)?|Sr|Sv|EVRM|Bbup))?/g;
function lawOf(num,rest,mark){
 if(mark){var w=mark.trim();return w==="AI"?"AI":w==="Sr"?"SR":w==="Sv"?"SV":w==="EVRM"?"EVRM":w==="Bbup"?"BBUP":"PW"}
 if(num==="40"||num==="41")return "SR";
 if(num==="7"&&/lid\s+[34]\b/.test(rest))return "PW";
 return "AI";
}
function refUrl(law,num){var L=LAWS[law];return "https://wetten.overheid.nl/jci1.3:c:"+L[0]+(law==="EVRM"?"":"&artikel="+num)}
function refLink(txt,num,rest,mark){
 var law=lawOf(num,rest,mark),L=LAWS[law];
 return '<a class="wl" href="'+refUrl(law,num)+'" target="_blank" rel="noopener" title="Wettekst: '+L[1]+(law==="EVRM"?"":" art. "+num)+' (wetten.overheid.nl)">'+txt+'</a>';
}
function refsOf(text,spec){
 var out=[],seen={},m;
 function add(law,num){var k=law+num;if(seen[k])return;seen[k]=1;out.push('<a class="wl" href="'+refUrl(law,num)+'" target="_blank" rel="noopener">'+LAWS[law][1]+(law==="EVRM"?(num?" art. "+num:""):" art. "+num)+'</a>')}
 REF.lastIndex=0;
 while((m=REF.exec(text))){add(lawOf(m[1],m[2]||"",m[3]),m[1])}
 (spec||"").split(";").forEach(function(x){x=x.trim();if(!x)return;var q=x.split(" ");add(q[0],q[1])});
 return out;
}
function linkDom(root){
 var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[],n;
 while((n=w.nextNode())){var bad=false,e=n.parentNode;while(e&&e!==root){if(e.tagName==="BUTTON"||e.tagName==="A"){bad=true;break}e=e.parentNode}if(!bad&&/[Aa]rt(?:ikel|\.)\s+\d/.test(n.nodeValue))nodes.push(n)}
 nodes.forEach(function(t){
  var h=esc(t.nodeValue).replace(REF,function(x,num,rest,mark){return refLink(x,num,rest||"",mark)});
  var s=document.createElement("span");s.innerHTML=h;
  s.querySelectorAll("a.wl").forEach(function(a){a.onclick=function(ev){ev.stopPropagation()}});
  t.parentNode.replaceChild(s,t);
 });
}
function strip(h){var d=document.createElement("div");d.innerHTML=h;return d.textContent||""}
function buildIndex(){
 INDEX=[];
 Object.keys(MIDDELEN).forEach(function(k){MIDDELEN[k].forEach(function(r){INDEX.push(["Middel: "+k,r[0],strip(r[1])])})});
 CHECKS.forEach(function(c){INDEX.push(["Check",strip(c[0]),strip(c[1])])});
 STATIC.forEach(function(x){INDEX.push(x)});
 MISTAKES.forEach(function(x){INDEX.push(["Valkuil",x[0],x[1]])});
 CARDS.forEach(function(c){INDEX.push(["Flitskaart: "+c[0],c[1],c[2]])});
}
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function hl(t,terms){
 var out=esc(t);
 terms.forEach(function(w){var re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");out=out.replace(re,"<mark>$1</mark>")});
 return out;
}
function vSearch(m,qv){
 if(!INDEX)buildIndex();
 var terms=qv.toLowerCase().split(/\s+/).filter(function(w){return w.length>0});
 var hits=INDEX.filter(function(e){var h=(e[0]+" "+e[1]+" "+e[2]).toLowerCase();return terms.every(function(w){return h.indexOf(w)>-1})});
 m.appendChild($('<p class="small" style="margin:0 0 6px">'+hits.length+' resultaten voor &ldquo;'+esc(qv)+'&rdquo;</p>'));
 var card=document.createElement("div");card.className="card";
 if(!hits.length)card.innerHTML="<p>Niets gevonden. Probeer een korter woord, bijvoorbeeld &lsquo;boei&rsquo; of &lsquo;uur&rsquo;.</p>";
 hits.slice(0,40).forEach(function(e){card.innerHTML+='<div class="res"><div class="sec">'+esc(e[0])+'</div><b>'+hl(e[1],terms)+'</b><span>'+hl(e[2],terms)+'</span></div>'});
 m.appendChild(card);
}
var qEl=document.getElementById("q"),qx=document.getElementById("qx"),upb=document.getElementById("up");
function runSearch(){qx.style.display=qEl.value?"block":"none";draw()}
qEl.addEventListener("input",runSearch);
qx.onclick=function(){qEl.value="";runSearch();qEl.focus()};
window.addEventListener("scroll",function(){upb.style.display=window.scrollY>300?"block":"none"},{passive:true});
upb.onclick=function(){window.scrollTo({top:0,behavior:"smooth"})};
draw();
</script>
